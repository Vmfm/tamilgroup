<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real 1-to-1 Random Chat</title>
    
    <!-- Load Firebase configuration script provided by user -->
    <script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background-color: var(--panel-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .status { font-size: 0.85rem; padding: 5px 12px; border-radius: 20px; background: #334155; color: var(--text-muted); }
        .status.online { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .container { flex: 1; display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; padding: 20px; gap: 20px; height: calc(100vh - 70px); }
        .lobby { background: var(--panel-bg); border-radius: 12px; padding: 40px; text-align: center; margin: auto; max-width: 450px; width: 100%; border: 1px solid #334155; }
        .btn { background-color: var(--accent); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn:hover { background-color: #4f46e5; }
        .btn-danger { background-color: var(--danger); width: auto; }
        .chat-box { display: none; flex-direction: column; flex: 1; background: var(--panel-bg); border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; word-break: break-word; }
        .msg.system { align-self: center; background: #334155; color: var(--text-muted); font-size: 0.85rem; border-radius: 20px; text-align: center; }
        .msg.incoming { align-self: flex-start; background: #334155; }
        .msg.outgoing { align-self: flex-end; background: var(--accent); }
        .controls { padding: 15px; background: #111827; display: flex; gap: 10px; border-top: 1px solid #334155; align-items: center; }
        .controls input { flex: 1; background: var(--panel-bg); border: 1px solid #334155; padding: 10px 15px; border-radius: 8px; color: white; outline: none; }
        .icon-btn { background: #334155; border: none; color: white; width: 42px; height: 42px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Real 1-to-1 Direct Chat</h1>
        <div id="statusIndicator" class="status">Disconnected</div>
    </header>

    <div class="container">
        <!-- Lobby Panel -->
        <div id="lobbyPanel" class="lobby">
            <h2>Find Random Partner</h2>
            <p style="color:var(--text-muted); margin: 15px 0 25px;">Connect directly peer-to-peer. No chat history is saved on Firebase storage.</p>
            <button class="btn" id="findBtn">Start Searching</button>
        </div>

        <!-- Chat Workspace -->
        <div id="chatWorkspace" class="chat-box">
            <div class="messages" id="messagesContainer">
                <div class="msg system">Connected to partner! Say hello.</div>
            </div>
            <div class="controls">
                <button class="icon-btn btn-danger" id="skipBtn" title="Disconnect / Next">✕</button>
                <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
                <button class="icon-btn" id="sendBtn" style="background:var(--accent);">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Ensure firebase configuration from external config.js is active
        if (typeof firebase !== 'undefined' && typeof firebaseConfig !== 'undefined') {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
        }

        const db = firebase.database();
        const myId = 'user_' + Math.random().toString(36).substring(2, 9);
        let roomId = null;
        let isCaller = false;
        let peerConnection = null;
        let dataChannel = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        const lobbyPanel = document.getElementById('lobbyPanel');
        const chatWorkspace = document.getElementById('chatWorkspace');
        const findBtn = document.getElementById('findBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const messagesContainer = document.getElementById('messagesContainer');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const skipBtn = document.getElementById('skipBtn');

        findBtn.addEventListener('click', () => {
            findBtn.innerText = "Searching queue...";
            findBtn.disabled = true;
            statusIndicator.innerText = "Searching...";
            findAndConnectPartner();
        });

        function findAndConnectPartner() {
            const poolRef = db.ref('match_pool');
            
            // Cleanup disconnect footprint automatically via Firebase .onDisconnect()
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    db.ref('match_pool/' + myId).onDisconnect().remove();
                }
            });

            poolRef.once('value', (snapshot) => {
                let matchedId = null;
                snapshot.forEach((child) => {
                    if (!matchedId && child.key !== myId) {
                        matchedId = child.key;
                    }
                });

                if (matchedId) {
                    // Match found: Remove other user from pool and initiate WebRTC Offer
                    db.ref('match_pool/' + matchedId).remove().then(() => {
                        isCaller = true;
                        roomId = matchedId;
                        setupWebRTC();
                        createAndSendOffer();
                    });
                } else {
                    // No one waiting: register ourselves and wait for someone to join
                    roomId = myId;
                    db.ref('match_pool/' + myId).set({ timestamp: firebase.database.ServerValue.TIMESTAMP });
                    statusIndicator.innerText = "Waiting for partner...";

                    // Listen if someone connects to our room signal channel
                    db.ref('signals/' + myId).on('child_added', (snapshot) => {
                        const signal = snapshot.val();
                        if (signal && !peerConnection) {
                            isCaller = false;
                            setupWebRTC();
                            handleIncomingSignal(signal);
                        }
                    });
                }
            });
        }

        function setupWebRTC() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            if (isCaller) {
                dataChannel = peerConnection.createDataChannel("chat");
                setupDataChannel();
            } else {
                peerConnection.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    setupDataChannel();
                };
            }

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const targetRoom = isCaller ? roomId : myId;
                    db.ref('signals/' + targetRoom).push({ type: 'candidate', candidate: event.candidate });
                }
            };

            // Listen for signaling updates on the active room connection
            const listenTarget = isCaller ? roomId : myId;
            db.ref('signals/' + listenTarget).on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                if (data.type === 'answer' && isCaller) {
                    peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                } else if (data.type === 'candidate' && peerConnection) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            });
        }

        async function createAndSendOffer() {
            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                db.ref('signals/' + roomId).push({ type: 'offer', offer: offer });
            } catch (err) {
                console.error(err);
            }
        }

        async function handleIncomingSignal(signal) {
            if (signal.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                db.ref('signals/' + myId).push({ type: 'answer', answer: answer });
            }
        }

        function setupDataChannel() {
            dataChannel.onopen = () => {
                transitionToChat();
            };
            dataChannel.onmessage = (event) => {
                appendMsg(event.data, 'incoming');
            };
            dataChannel.onclose = () => {
                handlePeerDisconnection();
            };
        }

        function transitionToChat() {
            lobbyPanel.classList.add('hidden');
            chatWorkspace.style.display = 'flex';
            statusIndicator.innerText = "Connected";
            statusIndicator.classList.add('online');
            msgInput.focus();
        }

        function sendTextMessage() {
            const txt = msgInput.value.trim();
            if (!txt || !dataChannel || dataChannel.readyState !== 'open') return;
            
            dataChannel.send(txt);
            appendMsg(txt, 'outgoing');
            msgInput.value = '';
        }

        sendBtn.addEventListener('click', sendTextMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        function appendMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handlePeerDisconnection() {
            appendMsg("Partner disconnected.", 'system');
            statusIndicator.innerText = "Disconnected";
            statusIndicator.classList.remove('online');
            cleanupFirebaseData();
            setTimeout(() => { location.reload(); }, 2000);
        }

        skipBtn.addEventListener('click', () => {
            if (dataChannel) dataChannel.close();
            cleanupFirebaseData();
            location.reload();
        });

        function cleanupFirebaseData() {
            if (roomId) {
                db.ref('signals/' + roomId).remove();
                db.ref('signals/' + myId).remove();
                db.ref('match_pool/' + myId).remove();
                db.ref('match_pool/' + roomId).remove();
            }
        }
    </script>
</body>
</html>
