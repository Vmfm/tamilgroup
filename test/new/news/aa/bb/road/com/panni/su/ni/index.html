<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>TAMIL VM Admin - Advanced Control</title>
    <style>
        :root {
            --bg: #0b141a;
            --card: #111b21;
            --accent: #25d366;
            --danger: #ff3b30;
            --warning: #ff9500;
            --info: #34b7f1;
            --text: #e9edef;
            --muted: #8696a0;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        header {
            background: var(--card);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container { padding: 10px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        h2 { font-size: 16px; margin: 0 0 15px 0; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        .search-box, .admin-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #2a3942;
            background: #111b21;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; color: var(--muted); padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-safe { background: var(--accent); color: white; }
        .btn-warn { background: var(--warning); color: white; }
        .btn-info { background: var(--info); color: white; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: var(--accent); }
        .offline { background: #555; }

        .user-cell { display: flex; align-items: center; gap: 10px; }
        .user-avatar { 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            object-fit: cover; 
            background: #2a3942; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        #auth-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box { background: var(--card); padding: 30px; border-radius: 16px; text-align: center; width: 85%; max-width: 300px; }
        
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .call-log-item { 
            padding: 10px; 
            border-bottom: 1px solid #2a3942; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .hide-mobile { display: none; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box">
        <h3>Admin Secure Login</h3>
        <input type="password" id="adminPass" class="search-box" placeholder="Password">
        <button class="btn btn-safe" style="width:100%; padding: 12px;" onclick="attemptLogin()">Access Console</button>
    </div>
</div>

<header>
    <div style="font-weight: 700;">🛡️ TAMIL VM ADMIN</div>
    <button class="btn btn-warn" onclick="logout()">Logout</button>
</header>

<div class="container">
    <div class="grid">
        <div class="card" style="grid-column: span 2;">
            <h2>
                User Management 
                <small id="auto-status" style="font-size: 10px; color: var(--muted);"></small>
            </h2>
            <input type="text" id="userSearch" class="search-box" placeholder="Search by name or Device ID..." onkeyup="filterUsers()">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>User Profile</th>
                            <th>Status / Device</th>
                            <th>Last Seen</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userList"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>📢 Admin Notifications</h2>
            <textarea id="notifyText" class="admin-input" placeholder="Type message to all users..."></textarea>
            <button class="btn btn-safe" style="width: 100%" onclick="sendGlobalAlert()">Broadcast to All</button>
            <hr style="border:0; border-top:1px solid #2a3942; margin: 15px 0;">
            <h2>Call History <button class="btn btn-danger" style="font-size: 9px; padding: 4px;" onclick="clearAllCalls()">Clear</button></h2>
            <div id="callList" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>

    <div class="grid" style="margin-top: 20px;">
        <div class="card">
            <h2>Recent Reports</h2>
            <div id="reportList"></div>
        </div>

        <div class="card">
            <h2>Global Message Log</h2>
            <div id="msgLogs" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://vmfm.github.io/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
    const CONFIG = {
        pass: "veera123", 
        cleanupDays: 20, 
        storageKey: "admin_session",
        defaultAvatar: "https://cdn-icons-png.flaticon.com/512/149/149071.png"
    };

    let allUsersData = {}; 

    window.onload = () => {
        if(localStorage.getItem(CONFIG.storageKey) === "true") showPanel();
    };

    function attemptLogin() {
        if(document.getElementById('adminPass').value === CONFIG.pass) {
            localStorage.setItem(CONFIG.storageKey, "true");
            showPanel();
        } else {
            alert("Wrong Password");
        }
    }

    function logout() {
        localStorage.removeItem(CONFIG.storageKey);
        location.reload();
    }

    function showPanel() {
        document.getElementById('auth-overlay').style.display = 'none';
        startDashboard();
    }

    function startDashboard() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        autoCleanup(db);
        loadUsers(db);
        loadReports(db);
        loadMessages(db);
        loadCallHistory(db);
    }

    // --- ENHANCED BANNED LOGIC ---
    function deviceBan(username, deviceId, isCurrentlyBanned) {
        const db = firebase.database();
        const action = isCurrentlyBanned ? "Unban" : "PERMANENTLY BAN (Device + User) and CLEAR ALL DATA for";
        
        if(confirm(`${action} ${username}?`)) {
            // 1. Toggle profile ban status
            db.ref(`profiles/${username}`).update({ banned: !isCurrentlyBanned });
            
            if(!isCurrentlyBanned) {
                // 2. Hardware Block: Blocks this phone from logging into ANY account
                if(deviceId) db.ref(`banned_devices/${deviceId}`).set({
                    owner: username,
                    date: Date.now()
                });

                // 3. Purge: Clear all content
                cleanUserActivity(username);
                
                // 4. Force Offline
                db.ref(`status/${username}`).update({ online: false });
                alert(`${username} banned. All messages and device access removed.`);
            } else {
                // Unban Logic
                if(deviceId) db.ref(`banned_devices/${deviceId}`).remove();
                alert(`${username} access restored.`);
            }
        }
    }

    function cleanUserActivity(username) {
        const db = firebase.database();
        
        // Clear Group Messages
        db.ref('messages').once('value', snap => {
            const msgs = snap.val() || {};
            Object.keys(msgs).forEach(id => {
                if(msgs[id].name === username) db.ref(`messages/${id}`).remove();
            });
        });

        // Clear Private/Signaling Activity (if any in 'calls')
        db.ref('calls').once('value', snap => {
            const calls = snap.val() || {};
            Object.keys(calls).forEach(id => {
                if(calls[id].caller === username || calls[id].receiver === username) {
                    db.ref(`calls/${id}`).remove();
                }
            });
        });
    }

    function sendGlobalAlert() {
        const text = document.getElementById('notifyText').value;
        if(!text) return;
        
        firebase.database().ref('messages').push({
            name: "SYSTEM ADMIN",
            text: "📢 " + text,
            timestamp: Date.now(),
            isAdmin: true
        });
        document.getElementById('notifyText').value = '';
        alert("Notification sent!");
    }

    // --- EXISTING DASHBOARD LOGIC ---
    function loadUsers(db) {
        db.ref('profiles').on('value', snap => {
            allUsersData = snap.val() || {};
            renderUserTable(allUsersData);
        });
    }

    function renderUserTable(users) {
        const list = document.getElementById('userList');
        list.innerHTML = '';
        
        Object.keys(users).forEach(u => {
            const data = users[u];
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="user-cell">
                        <img src="${data.pic || CONFIG.defaultAvatar}" class="user-avatar">
                        <b>${u}</b>
                    </div>
                </td>
                <td>
                    <span class="status-dot ${data.online ? 'online' : 'offline'}"></span>
                    <small>${data.deviceId ? 'Device: ' + data.deviceId.substring(0,8) : 'No Device ID'}</small>
                </td>
                <td><small>${formatLastSeen(data.lastSeen)}</small></td>
                <td>
                    <div class="btn-group">
                        <button class="btn btn-danger" onclick="manualRemove('${u}')">Del</button>
                        <button class="btn ${data.banned ? 'btn-safe' : 'btn-warn'}" onclick="deviceBan('${u}', '${data.deviceId || ''}', ${data.banned || false})">
                            ${data.banned ? 'Unban' : 'Ban & Purge'}
                        </button>
                        <button class="btn btn-info" onclick="directMessage('${u}')">Notify</button>
                    </div>
                </td>
            `;
            list.appendChild(tr);
        });
    }

    function directMessage(u) {
        const msg = prompt(`Send notification to ${u}:`);
        if(msg) {
            firebase.database().ref('messages').push({
                name: "ADMIN",
                text: `@${u} ${msg}`,
                timestamp: Date.now()
            });
        }
    }

    function manualRemove(username) {
        if(confirm(`Permanently delete ${username}?`)) {
            const db = firebase.database();
            db.ref(`profiles/${username}`).remove();
            db.ref(`status/${username}`).remove();
            cleanUserActivity(username);
        }
    }

    function loadCallHistory(db) {
        db.ref('calls').limitToLast(15).on('value', snap => {
            const container = document.getElementById('callList');
            container.innerHTML = '';
            const calls = snap.val() || {};
            Object.keys(calls).reverse().forEach(id => {
                const c = calls[id];
                const div = document.createElement('div');
                div.className = 'call-log-item';
                div.innerHTML = `<span>📞 ${c.caller} ⮕ ${c.receiver}</span><button class="btn btn-danger" style="padding:2px 5px" onclick="deleteNode('calls/${id}')">X</button>`;
                container.appendChild(div);
            });
        });
    }

    function loadMessages(db) {
        db.ref('messages').limitToLast(30).on('value', snap => {
            const container = document.getElementById('msgLogs');
            container.innerHTML = '';
            const msgs = snap.val() || {};
            Object.keys(msgs).reverse().forEach(id => {
                const m = msgs[id];
                const div = document.createElement('div');
                div.style.padding = "8px";
                div.style.borderBottom = "1px solid #2a3942";
                div.style.display = "flex";
                div.style.justifyContent = "space-between";
                div.innerHTML = `
                    <div style="font-size:12px"><b>${m.name}:</b> ${m.text || 'Media'}</div>
                    <button class="btn btn-danger" onclick="deleteNode('messages/${id}')" style="padding:2px 5px">X</button>
                `;
                container.appendChild(div);
            });
        });
    }

    function deleteNode(path) {
        if(confirm("Delete this?")) firebase.database().ref(path).remove();
    }

    function clearAllCalls() {
        if(confirm("Clear all logs?")) firebase.database().ref('calls').remove();
    }

    function autoCleanup(db) {
        const now = Date.now();
        const limit = CONFIG.cleanupDays * 24 * 60 * 60 * 1000;
        db.ref('profiles').once('value', snap => {
            const users = snap.val() || {};
            let count = 0;
            Object.keys(users).forEach(u => {
                if(now - (users[u].lastSeen || 0) > limit) {
                    db.ref(`profiles/${u}`).remove();
                    db.ref(`status/${u}`).remove();
                    count++;
                }
            });
            document.getElementById('auto-status').innerText = `(Auto-cleaned: ${count})`;
        });
    }

    function filterUsers() {
        const query = document.getElementById('userSearch').value.toLowerCase();
        const filtered = {};
        Object.keys(allUsersData).forEach(u => {
            if(u.toLowerCase().includes(query) || (allUsersData[u].deviceId && allUsersData[u].deviceId.includes(query))) {
                filtered[u] = allUsersData[u];
            }
        });
        renderUserTable(filtered);
    }

    function loadReports(db) {
        db.ref('reports').limitToLast(5).on('value', snap => {
            const container = document.getElementById('reportList');
            container.innerHTML = '';
            const data = snap.val() || {};
            Object.keys(data).reverse().forEach(id => {
                const r = data[id];
                const div = document.createElement('div');
                div.style.marginBottom = "8px";
                div.innerHTML = `<small>🚩 <b>${r.reported}</b> by ${r.by}</small>`;
                container.appendChild(div);
            });
        });
    }

    function formatLastSeen(ts) {
        if(!ts) return "Never";
        const d = new Date(ts);
        return d.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
    }
</script>
</body>
</html>
