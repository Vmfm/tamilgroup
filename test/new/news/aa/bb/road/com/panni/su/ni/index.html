<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            padding: 15px;
        }
        .stream-card {
            position: relative;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .live-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff0050;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
        }
        #myVideo { border: 2px solid #00d1ff; }
        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Live Discovery</h4>
        <div id="loader" class="spinner-border spinner-border-sm text-primary" role="status"></div>
    </div>

    <!-- Self Preview -->
    <div class="row mb-4">
        <div class="col-6 col-md-3 mx-auto">
            <div class="stream-card glass-card">
                <span class="live-badge">YOU</span>
                <video id="myVideo" autoplay muted playsinline></video>
            </div>
        </div>
    </div>

    <hr>

    <!-- Live Users Grid -->
    <div class="video-grid" id="streamsContainer">
        <!-- Remote streams appear here -->
    </div>
</div>

<div class="controls">
    <button id="btnGoLive" class="btn btn-danger rounded-pill px-4 shadow">Go Live</button>
</div>

<!-- Firebase Config & Scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
    // Initialize Firebase (Assuming config.js provides firebaseConfig)
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const myId = "user_" + Math.floor(Math.random() * 10000); // Replace with actual Auth ID if available
    let localStream;
    let isLive = false;

    const myVideo = document.getElementById('myVideo');
    const streamsContainer = document.getElementById('streamsContainer');
    const btnGoLive = document.getElementById('btnGoLive');
    const loader = document.getElementById('loader');

    // 1. Get Camera Permissions
    async function initCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            myVideo.srcObject = localStream;
            loader.style.display = 'none';
        } catch (e) {
            console.error("Camera access denied", e);
            alert("Please enable camera to stream.");
        }
    }

    // 2. Toggle Live Status in Firebase
    btnGoLive.onclick = () => {
        isLive = !isLive;
        if (isLive) {
            btnGoLive.innerText = "Stop Streaming";
            btnGoLive.classList.replace('btn-danger', 'btn-secondary');
            
            // Set user as active in Firebase
            db.ref(`live_streams/${myId}`).set({
                id: myId,
                status: "active",
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            // Auto-remove if user disconnects
            db.ref(`live_streams/${myId}`).onDisconnect().remove();
        } else {
            stopStreaming();
        }
    };

    function stopStreaming() {
        isLive = false;
        btnGoLive.innerText = "Go Live";
        btnGoLive.classList.replace('btn-secondary', 'btn-danger');
        db.ref(`live_streams/${myId}`).remove();
    }

    // 3. Listen for other Live Users
    db.ref('live_streams').on('value', snapshot => {
        streamsContainer.innerHTML = '';
        snapshot.forEach(child => {
            const userData = child.val();
            if (userData.id !== myId) {
                renderRemoteUser(userData.id);
            }
        });
    });

    function renderRemoteUser(userId) {
        const card = document.createElement('div');
        card.className = 'stream-card glass-card';
        card.innerHTML = `
            <span class="live-badge">LIVE</span>
            <div class="d-flex align-items-center justify-content-center h-100">
                <p class="small text-center">User ${userId}<br><button class="btn btn-sm btn-primary mt-2">Watch</button></p>
            </div>
        `;
        streamsContainer.appendChild(card);
    }

    // Cleanup on 20 days inactivity (Logic handled by your existing backend script)
    
    initCamera();
</script>

</body>
</html>
