<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil VM FM - Premium Live Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1120;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
            --accent: #38bdf8;
            --fav: #fbbf24;
            --glass: rgba(15, 23, 42, 0.8);
        }

        .light-mode {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --accent: #0284c7;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            transition: background 0.3s ease;
        }

        /* --- Loader --- */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #loader img { width: 60px; filter: drop-shadow(0 0 10px var(--accent)); }

        /* --- Header --- */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo { font-weight: 700; font-size: 1.1rem; color: var(--accent); letter-spacing: -0.5px; }
        
        .nav-group { display: flex; gap: 8px; }

        button {
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-fav { background: var(--fav); color: #000; }
        .btn-mode { background: var(--card-bg); color: var(--text); border: 1px solid rgba(128,128,128,0.2); }
        button:active { transform: scale(0.95); }

        /* --- Grid System --- */
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 8px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s;
            text-align: center;
        }

        .card:hover { transform: translateY(-3px); border-color: var(--accent); }

        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        .fav-icon {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 18px;
            cursor: pointer;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .name {
            margin-top: 8px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 11px;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>

<div id="loader">
    <img src="https://vmfm.github.io/tamil/Images/loading3.gif" alt="Loading">
</div>

<header>
    <div class="logo">TAMIL VM FM</div>
    <div class="nav-group">
        <button class="btn-fav" onclick="window.location.href='go:fave'">⭐ FAVS</button>
        <button class="btn-mode" onclick="toggleMode()">🌓</button>
    </div>
</header>

<div class="container" id="content" style="display:none;">
    <div class="grid" id="station-grid">
        </div>

    <footer>DESIGNED BY TAMILVM</footer>
</div>

<script>
    // Config: Base URL for all images
    const IMG_BASE = "https://vmfm.github.io/tamil/Images/";

    // Station Database
    const stations = [

        { n: "KUMARI FM", i: "airnagercovilfm.jpg", l: "go:nagerfm" },

        { n: "COVAI FM", i: "aircoimbaturefm.jpg", l: "go:covaifm" },
        { n: "OOTY FM", i: "airootyfm.jpg", l: "go:ootyfm" },
        { n: "MADURAI FM", i: "airmaduraifm.jpg", l: "go:Fmmadu" },
        { n: "TAMILNA FM", i: "airtamilnadufm.jpg", l: "go:airtamilna" },
        { n: "AIR TAMIL", i: "airtamillivefm.jpg", l: "go:airtamil" },
        { n: "AIRGOLD FM", i: "airgoldfm.jpg", l: "go:airgold" },
        { n: "VIVIDH FM", i: "airtrichyfm.jpg", l: "go:vividhbhar" },
        { n: "KODAI FM", i: "airKodaikanalfm.jpg", l: "go:kodai" },
        { n: "TNVIBE FM", i: "tnvibefm-1.jpg", l: "go:tnvibefm" },
        { n: "PUDUGAI CITY", i: "pudhugai.jpg", l: "go:pudugaicit" },
        { n: "RADIOPETTI", i: "radiopetti1.jpg", l: "go:RadioPett" },
        { n: "THENI FM", i: "thenifm.jpg", l: "go:thenifm" },
        { n: "SIVAGA FM", i: "ssradiosivagangai.png", l: "go:sivaganga" },
        { n: "PERAMB FM", i: "perambalurfm.png", l: "go:peram" },
        { n: "THIRUDAN FM", i: "thirudanfm.png", l: "go:thirudan" },
        { n: "VIRUDHA FM", i: "virudhairadio.jpg", l: "go:virudhai" },
        { n: "PSTAMIL FM", i: "pstamilradio.png", l: "go:PSTamilR" },
        { n: "JAI FM", i: "erodejaifm.jpg", l: "go:erodejai" },
        { n: "ISAIPA FM", i: "isaiparavai-1.jpg", l: "go:isaiparava" },
        { n: "TAMILAI FM", i: "tamilaifm-1.jpg", l: "go:tamilaifm" },
        { n: "TAMIZ FM", i: "tamizenradio.png", l: "go:Tamizen" },
        { n: "TAMILNA FM", i: "tamilnadufm.png", l: "go:Tamilnadu" },
        { n: "SSNATHAM FM", i: "mathamradio.jpeg", l: "go:NTMRadio" },
        { n: "HARI FM", i: "haritamilfm-1.jpg", l: "go:harifm" },
        { n: "REMIX FM", i: "tamilremixhitsfm.jpeg", l: "go:TamilRemi" },
        { n: "MEGAZON FM", i: "megazonesouthnew-1.jpg", l: "go:megazon" },
        { n: "DINDUGAL FM", i: "dindugalfm.jpeg", l: "go:Dindigul" },
        { n: "KOTTAR FM", i: "FM%20Kottarakkara.png", l: "go:FMKottara" },
        { n: "GINGEE FM", i: "gingeefm.jpg", l: "go:GingeeFm" },
        { n: "SUBAG FM", i: "subageetham.jpeg", l: "go:subagee" },
        { n: "NAMMA FM", i: "nammaradio.png", l: "go:nammaradio" },
        { n: "VAANAVIL2 FM", i: "vaanavilvaanoli-1.png", l: "go:vaanavil2" },
        { n: "MANNAI FM", i: "mannaifm.jpg", l: "go:mannaifm" },
        { n: "BRITISH FM", i: "British%20Indian%20Tamil%20Radio%202-1.png", l: "go:British" },
        { n: "TTHANGA FM", i: "tamilthangamgm.jpeg", l: "go:tthanga" },
        { n: "AMU PLUSH", i: "amuthamhdplush.jpg", l: "go:amuplush" },
        { n: "CHILLAX FM", i: "chillaxfm1.png", l: "go:chillax" },
        { n: "KINGTAMIL FM", i: "King%20fm%20tamil%201.png", l: "go:Kingtamil" },
        { n: "MINNAL FM", i: "vallioorminnalfm.png", l: "go:Vallioor" },
        { n: "AMARAVA FM", i: "amaravathiradio.png", l: "go:Amaravathi" },
        { n: "CHEEMAI FM", i: "cheemaifm.png", l: "go:cheemai" },
        { n: "MAGIZH FM", i: "magizhfm.jpeg", l: "go:Magizh" },
        { n: "CUDDALOU FM", i: "nammacuddalorefm.jpg", l: "go:ammaCuddN" },
        { n: "THIRUTHANI FM", i: "thiruthanicityfm.jpg", l: "go:Thiruthani" },
        { n: "RAGAM FM", i: "tamilragam.jpg", l: "go:TamilRaga" },
        { n: "NATHI FM", i: "Nathi%20FM.jpg", l: "go:Nathifm" },
        { n: "RJ TAMIL", i: "rjtamil-pudugai.jpg", l: "go:rjtamil" },
        { n: "SAARAL FM", i: "saaral-fm.jpg", l: "go:saaralfm" },
        { n: "SKYWAY FM", i: "Skyway%20Tamil%20FM%20(1).jpg", l: "go:Skyway" }
    ];

    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

    // Render Function
    function init() {
        const grid = document.getElementById("station-grid");
        grid.innerHTML = stations.map(s => {
            const isFav = favorites.some(f => f.name === s.n);
            return `
                <div class="card">
                    <div class="fav-icon" onclick="toggleFav(this, '${s.n}', '${s.i}', '${s.l}')">
                        ${isFav ? '⭐' : '☆'}
                    </div>
                    <a href="${s.l}">
                        <img src="${IMG_BASE + s.i}" loading="lazy">
                        <div class="name">${s.n}</div>
                    </a>
                </div>
            `;
        }).join('');

        setTimeout(() => {
            document.getElementById("loader").style.display = "none";
            document.getElementById("content").style.display = "block";
        }, 1500);
    }

    function toggleFav(el, name, img, link) {
        const idx = favorites.findIndex(f => f.name === name);
        if (idx > -1) {
            favorites.splice(idx, 1);
            el.textContent = "☆";
        } else {
            favorites.push({ name, img, link });
            el.textContent = "⭐";
        }
        localStorage.setItem("favorites", JSON.stringify(favorites));
    }

    function toggleMode() {
        document.body.classList.toggle("light-mode");
    }

    window.onload = init;
</script>

</body>
</html>
