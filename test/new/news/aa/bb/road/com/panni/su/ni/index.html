    <style>
        :root {
            --bg-color: #051937;
            --card-bg: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent-color: #ffcc00;
            --fav-color: #ff6600;
        }

        .light-mode {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #004e92;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        /* Header & Navigation */
        header {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo { font-weight: 600; font-size: 1.2rem; letter-spacing: 1px; }

        .nav-buttons { display: flex; gap: 10px; }

        button {
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:active { transform: scale(0.95); }

        .btn-fav { background: var(--fav-color); color: white; }
        .btn-mode { background: var(--accent-color); color: #000; }

        /* Search Bar */
        .search-container {
            padding: 20px;
            text-align: center;
        }

        #searchInput {
            width: 90%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: var(--card-bg);
            color: var(--text-color);
            outline: 2px solid var(--accent-color);
        }

        /* Grid Layout */
        .container {
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 800px;
            margin: auto;
        }

        /* Station Card */
        .station-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .station-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .station-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .station-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .station-info {
            padding: 10px 5px;
            text-align: center;
        }

        .station-name {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Favorite Star */
        .favorite-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* Mobile Adjustments */
        @media (max-width: 400px) {
            .container { gap: 8px; }
            .station-name { font-size: 0.7rem; }
        }
    </style>
</head>

<script>
    // Favorites Logic
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

    function updateFavButtons() {
        document.querySelectorAll(".favorite-btn").forEach(btn => {
            const name = btn.dataset.name;
            btn.textContent = favorites.find(f => f.name === name) ? "⭐" : "☆";
            btn.style.color = favorites.find(f => f.name === name) ? "#ffcc00" : "white";
        });
    }

    document.addEventListener("click", function(e) {
        if (e.target.classList.contains("favorite-btn")) {
            const btn = e.target;
            const station = {
                name: btn.dataset.name,
                img: btn.dataset.img,
                link: btn.dataset.link
            };

            const index = favorites.findIndex(f => f.name === station.name);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(station);
            }

            localStorage.setItem("favorites", JSON.stringify(favorites));
            updateFavButtons();
        }
    });

    // Theme Toggle
    function toggleMode() {
        document.body.classList.toggle("light-mode");
    }

    // Search Filter
    function filterStations() {
        let input = document.getElementById('searchInput').value.toUpperCase();
        let cards = document.getElementsByClassName('station-card');
        
        for (let i = 0; i < cards.length; i++) {
            let name = cards[i].getAttribute('data-name');
            if (name.toUpperCase().indexOf(input) > -1) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    // Initial Load
    window.onload = updateFavButtons;
</script>
