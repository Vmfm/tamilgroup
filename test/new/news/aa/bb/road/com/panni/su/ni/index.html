<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tamil Group Live</title>
<style>
:root{--bg:#0b141a;--panel:#202c33;--accent:#25d366;--live:#ff3b30;--glass:rgba(255, 255, 255, 0.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e9edef;font-family:Arial,system-ui;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* --- TOP BAR --- */
#topBar{padding:12px;background:#0b141a;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glass);z-index:100}
.logo{font-weight:700;font-size:18px;letter-spacing:1px}
.logo span{color:var(--accent)}
#goLiveBtn{background:var(--live);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;animation:pulse 2s infinite}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
}

/* --- LIVE GRID --- */
#streamSection{flex:1;padding:10px;overflow-y:auto}
.grid-title{font-size:14px;color:var(--accent);margin-bottom:12px;font-weight:600;text-transform:uppercase}
#streamGrid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px}

.live-card{background:var(--panel);border-radius:12px;aspect-ratio:1/1.4;position:relative;overflow:hidden;border:1px solid var(--glass);cursor:pointer}
.live-card img{width:100%;height:100%;object-fit:cover}
.live-card .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#2a3942;font-size:30px;color:var(--accent)}
.live-tag{position:absolute;top:6px;left:6px;background:var(--live);font-size:9px;padding:2px 6px;border-radius:4px;font-weight:bold}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(transparent, rgba(0,0,0,0.9));font-size:11px;font-weight:600}

/* --- OVERLAY --- */
#streamOverlay{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center}
#mainVideo{width:100%;height:100%;object-fit:cover;background:#000}
.stream-header{position:absolute;top:0;left:0;right:0;padding:20px;background:linear-gradient(rgba(0,0,0,0.8), transparent);display:flex;justify-content:space-between;z-index:1001}
.stream-footer{position:absolute;bottom:30px;display:flex;gap:20px;z-index:1001}
.round-btn{width:56px;height:56px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:#fff}
.btn-close{background:rgba(255,255,255,0.2)}
.btn-stop{background:var(--live)}

/* --- NAV --- */
#navBar{display:flex;background:#0b141a;border-top:1px solid var(--glass);padding:10px 0}
.nav-item{flex:1;text-align:center;font-size:11px;color:#8696a0;cursor:pointer}
.nav-item.active{color:var(--accent)}
.nav-icon{font-size:22px;display:block;margin-bottom:4px}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2a3942;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;display:none;z-index:10000}
</style>
</head>
<body>

<div id="app">
    <div id="topBar">
        <div class="logo">TAMIL <span>LIVE</span></div>
        <button id="goLiveBtn">● GO LIVE</button>
    </div>
    <div id="streamSection">
        <div class="grid-title">Active Streamers</div>
        <div id="streamGrid"></div>
    </div>
    <div id="navBar">
        <div class="nav-item active"><span class="nav-icon">🎥</span>Live</div>
        <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">💬</span>Chat</div>
        <div class="nav-item"><span class="nav-icon">👤</span>Profile</div>
    </div>
</div>

<div id="streamOverlay">
    <div class="stream-header">
        <div id="streamerName" style="font-weight:bold">Live Stream</div>
        <div style="background:var(--live);padding:2px 10px;border-radius:4px;font-size:12px">LIVE</div>
    </div>
    <video id="mainVideo" autoplay playsinline></video>
    <div class="stream-footer">
        <button class="round-btn btn-close" id="closeOverlay">✕</button>
        <button class="round-btn btn-stop" id="stopStreaming" style="display:none">⏹</button>
    </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const username = localStorage.getItem('guestName') || 'User' + Math.floor(Math.random()*9999);
const profileImg = localStorage.getItem('profileImage') || '';

let localStream = null;
let peerConnection = null;
const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

const streamGrid = document.getElementById('streamGrid');
const goLiveBtn = document.getElementById('goLiveBtn');
const streamOverlay = document.getElementById('streamOverlay');
const mainVideo = document.getElementById('mainVideo');
const stopStreaming = document.getElementById('stopStreaming');
const closeOverlay = document.getElementById('closeOverlay');

// --- BROADCASTER LOGIC ---
goLiveBtn.onclick = async () => {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        mainVideo.srcObject = localStream;
        mainVideo.muted = true;
        streamOverlay.style.display = 'flex';
        stopStreaming.style.display = 'flex';
        document.getElementById('streamerName').textContent = "Broadcasting Live";

        const streamRef = db.ref(`liveStreams/${username}`);
        await streamRef.set({ username, image: profileImg, active: true });
        streamRef.onDisconnect().remove();

        // Listen for Viewers joining
        db.ref(`calls/${username}`).on('child_added', async (snapshot) => {
            const data = snapshot.val();
            if (data.offer) {
                const pc = new RTCPeerConnection(servers);
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                
                await snapshot.ref.update({ answer: { type: answer.type, sdp: answer.sdp } });
                
                pc.onicecandidate = (event) => {
                    if (event.candidate) snapshot.ref.child('broadcasterCandidates').push(event.candidate.toJSON());
                };
            }
        });

        showToast("You are now LIVE!");
    } catch (err) {
        showToast("Camera access denied.");
    }
};

// --- VIEWER LOGIC ---
async function joinStream(hostId, hostName) {
    if (hostId === username) return;
    
    streamOverlay.style.display = 'flex';
    stopStreaming.style.display = 'none';
    document.getElementById('streamerName').textContent = `Watching ${hostName}`;
    mainVideo.muted = false;

    peerConnection = new RTCPeerConnection(servers);
    const remoteStream = new MediaStream();
    mainVideo.srcObject = remoteStream;

    peerConnection.ontrack = (event) => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
    };

    const callRef = db.ref(`calls/${hostId}`).push();
    
    peerConnection.onicecandidate = (event) => {
        if (event.candidate) callRef.child('viewerCandidates').push(event.candidate.toJSON());
    };

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    await callRef.set({ offer: { type: offer.type, sdp: offer.sdp } });

    callRef.on('value', async (snapshot) => {
        const data = snapshot.val();
        if (data?.answer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
    });

    callRef.child('broadcasterCandidates').on('child_added', (snapshot) => {
        peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
    });
}

// --- UI HELPERS ---
function listenForLiveUsers() {
    db.ref('liveStreams').on('value', snap => {
        streamGrid.innerHTML = '';
        const data = snap.val();
        if (!data) {
            streamGrid.innerHTML = '<div style="grid-column:span 3;text-align:center;padding:40px;color:#8696a0;">No streams found.</div>';
            return;
        }
        Object.keys(data).forEach(uid => {
            const stream = data[uid];
            const card = document.createElement('div');
            card.className = 'live-card';
            card.innerHTML = `
                <div class="live-tag">LIVE</div>
                ${stream.image ? `<img src="${stream.image}">` : `<div class="no-img">${stream.username.charAt(0)}</div>`}
                <div class="card-info">${stream.username}</div>
            `;
            card.onclick = () => joinStream(uid, stream.username);
            streamGrid.appendChild(card);
        });
    });
}

function stopEverything() {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (peerConnection) peerConnection.close();
    db.ref(`liveStreams/${username}`).remove();
    db.ref(`calls/${username}`).remove();
    streamOverlay.style.display = 'none';
    mainVideo.srcObject = null;
}

stopStreaming.onclick = stopEverything;
closeOverlay.onclick = stopEverything;
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}

listenForLiveUsers();
window.onbeforeunload = stopEverything;
</script>
</body>
</html>
