<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WhatsApp Full Chat & Live</title>
<style>
:root{--bg:#111b21;--panel:#202c33;--accent:#25d366;--muted:#97a4ab;--online:#25d366;--offline:#8696a0;--live:#ff3b30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e9edef;font-family:Arial,system-ui;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* --- LOADER CSS --- */
#loader-wrapper { position: fixed; inset: 0; background: #0b141a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
.loader-wheel { width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #ffeb3b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
.loader-text { color: #ffeb3b; font-size: 14px; font-weight: 500; letter-spacing: 1px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#app{max-width:1100px;margin:0 auto;width:100%;height:100vh;display:flex;flex-direction:column;position:relative;transition:transform .28s ease}
#topBar{padding:8px 12px;background:#0b141a;display:flex;align-items:center;gap:12px;z-index:5}
#title{font-weight:600;display:flex;align-items:center;gap:10px}

/* LIVE BUTTON TOP */
#liveBtnMain { background: var(--live); color: #fff; border: none; padding: 6px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 12px; animation: pulse-red 2s infinite; }
@keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

#panel{position:fixed;right:0;top:0;height:100vh;width:360px;background:#081214;border-left:1px solid rgba(255,255,255,.03);transform:translateX(100%);transition:transform .28s ease;z-index:20;box-shadow:-20px 0 60px rgba(0,0,0,.6);display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
.panelHeader{padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.03);display:flex;align-items:center;gap:8px}
.panelClose{margin-left:auto;background:none;border:0;color:var(--accent);cursor:pointer;font-size:18px}
.panelList{padding:8px;overflow:auto;flex:1}
.panelItem{padding:10px;border-radius:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.panelItem:hover{background:rgba(255,255,255,.02)}

/* LIVE SECTION CSS */
#liveOverlay { position: fixed; inset: 0; background: #0b141a; z-index: 5000; display: none; flex-direction: column; }
.live-header { padding: 15px; display: flex; align-items: center; justify-content: space-between; background: #202c33; }
.live-content { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
.live-user-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #162027; border-radius: 12px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; }
.live-user-card:hover { border-color: var(--live); }
.live-badge { background: var(--live); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
.start-live-btn { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 20px; font-size: 16px; }

/* LIVE PLAYER */
#livePlayerContainer { position: fixed; inset: 0; background: #000; z-index: 6000; display: none; flex-direction: column; }
video#liveVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
.player-controls { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 6001; }
.player-info { position: absolute; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.viewer-count { background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px; font-size: 13px; display: flex; align-items: center; gap: 5px; }

#onlineCount { background: rgba(37, 211, 102, 0.1); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid rgba(37, 211, 102, 0.3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#071215}
.msg-row{display:flex;align-items:flex-end;max-width:80%;position:relative}
.msg-row.self{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 8px;position:relative;cursor:pointer;border:2px solid transparent;overflow:hidden}
.avatar.online{border-color:var(--accent);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 6px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.bubble{background:var(--panel);padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.3;word-break:break-word;position:relative}
.msg-row.self .bubble{background:#005c4b}
#inputBar{display:flex;padding:10px;background:var(--panel);align-items:center;gap:8px}
#messageInput{flex:1;padding:10px;border-radius:22px;border:0;background:#2a3942;color:#fff;outline:none}
#sendBtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#2a3942;color:#fff;padding:10px 14px;border-radius:10px;z-index:9999;opacity:0;transition:all .25s}
#toast.show{opacity:1;bottom:40px}

#loginWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:9999}
#loginCard{background:#0b141a;padding:22px;border-radius:16px;display:flex;flex-direction:column;gap:12px;min-width:320px;border: 1px solid rgba(255,255,255,0.05)}
#loginCard input, #loginCard select{padding:12px;border-radius:10px;border:0;background:#162027;color:#fff;outline:none}
#loginCard button{padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;font-weight:bold}

.fullscreen-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px; border-radius: 50%; cursor: pointer; }

@media(max-width:600px){ #panel{width:100%} }
</style>
</head>
<body>

<div id="loader-wrapper">
    <div class="loader-wheel"></div>
    <div class="loader-text">Initializing Systems...</div>
</div>

<!-- LIVE STREAMING OVERLAY -->
<div id="liveOverlay">
    <div class="live-header">
        <span style="font-weight:bold; font-size:18px">Live Streams</span>
        <button onclick="document.getElementById('liveOverlay').style.display='none'" style="background:none;border:0;color:#fff;font-size:24px;cursor:pointer">✕</button>
    </div>
    <div class="live-content">
        <button class="start-live-btn" id="prepareLiveBtn">Start Your Live Stream</button>
        <div style="margin-bottom:10px; color:var(--muted); font-size:13px">Active Live Users:</div>
        <div id="liveUsersList"></div>
    </div>
</div>

<!-- LIVE PLAYER / BROADCASTER SCREEN -->
<div id="livePlayerContainer">
    <div class="player-info">
        <div id="streamerAvatar" style="width:40px; height:40px; border-radius:50%; background:var(--panel); overflow:hidden"></div>
        <div>
            <div id="streamerName" style="font-weight:bold">Broadcaster</div>
            <div class="viewer-count">👁️ <span id="viewCount">0</span></div>
        </div>
    </div>
    <video id="liveVideo" autoplay playsinline muted></video>
    <div class="player-controls">
        <button id="toggleMic" class="fullscreen-btn">🎤</button>
        <button id="toggleCam" class="fullscreen-btn">📷</button>
        <button id="liveFullScreen" class="fullscreen-btn">⛶</button>
        <button id="stopLiveBtn" style="background:var(--live); border:none; color:#fff; padding:10px 20px; border-radius:20px; font-weight:bold; cursor:pointer">End Stream</button>
    </div>
</div>

<div id="app">
    <div id="topBar">
        <div id="title">Group Chat</div>
        <button id="liveBtnMain">● LIVE</button>
        <div style="flex:1"></div>
        <div id="onlineCount">0 online</div>
    </div>
    <div id="messages"></div>
    <div id="inputBar">
        <input id="messageInput" placeholder="Type a message" autocomplete="off"/>
        <button id="sendBtn">➤</button>
    </div>
</div>

<div id="loginWrap">
    <div id="loginCard">
        <div style="font-weight:700;color:#fff;font-size:18px;text-align:center">Join Chat & Live</div>
        <input id="nameInput" placeholder="Enter your name" />
        <select id="ageSelect">
            <option value="18+" selected>18+</option>
            <option value="Under 18">Under 18</option>
        </select>
        <input type="file" id="loginPhotoInput" accept="image/*" />
        <button id="joinBtn">Join Now</button>
    </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let username = localStorage.getItem('guestName') || '';
let profileImage = localStorage.getItem('profileImage') || '';
let userAge = localStorage.getItem('userAge') || '';

// DOM Elements
const messagesEl = document.getElementById('messages'), messageInput = document.getElementById('messageInput'), sendBtn = document.getElementById('sendBtn');
const loginWrap = document.getElementById('loginWrap'), nameInput = document.getElementById('nameInput'), joinBtn = document.getElementById('joinBtn');
const liveBtnMain = document.getElementById('liveBtnMain'), liveOverlay = document.getElementById('liveOverlay'), liveUsersList = document.getElementById('liveUsersList');
const prepareLiveBtn = document.getElementById('prepareLiveBtn'), livePlayerContainer = document.getElementById('livePlayerContainer'), liveVideo = document.getElementById('liveVideo'), stopLiveBtn = document.getElementById('stopLiveBtn');
const viewCountEl = document.getElementById('viewCount');

// Live State
let localStream = null;
let isBroadcasting = false;
let peerConnections = {};
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// --- CORE CHAT LOGIC ---
window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader-wrapper').style.display = 'none'; }, 1000); });

if(!username) { loginWrap.style.display = 'flex'; } else { startApp(); }

joinBtn.onclick = () => {
    const n = nameInput.value.trim();
    if(!n) return showToast("Enter name");
    username = n;
    userAge = document.getElementById('ageSelect').value;
    localStorage.setItem('guestName', n);
    localStorage.setItem('userAge', userAge);
    
    const file = document.getElementById('loginPhotoInput').files[0];
    if(file && userAge === '18+') {
        const reader = new FileReader();
        reader.onload = (e) => { profileImage = e.target.result; localStorage.setItem('profileImage', profileImage); startApp(); };
        reader.readAsDataURL(file);
    } else { startApp(); }
};

function startApp() {
    loginWrap.style.display = 'none';
    db.ref(`status/${username}`).set(true);
    db.ref(`status/${username}`).onDisconnect().remove();
    db.ref(`profiles/${username}`).update({ online: true, profileImage, age: userAge });
    
    // Listen for messages
    db.ref('messages').limitToLast(50).on('child_added', snap => {
        const d = snap.val();
        const row = document.createElement('div');
        row.className = 'msg-row' + (d.name === username ? ' self' : '');
        row.innerHTML = `<div class="avatar">${d.profileImage ? `<img src="${d.profileImage}" style="width:100%;height:100%;object-fit:cover">` : d.name[0]}</div>
                         <div class="bubble">${d.text}</div>`;
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    db.ref('status').on('value', s => { document.getElementById('onlineCount').textContent = `${s.numChildren()} online`; });
    
    initLiveSystem();
}

sendBtn.onclick = () => {
    const t = messageInput.value.trim();
    if(!t) return;
    db.ref('messages').push({ name: username, text: t, profileImage, time: Date.now() });
    messageInput.value = '';
};

// --- LIVE STREAM LOGIC ---
function initLiveSystem() {
    liveBtnMain.onclick = () => { liveOverlay.style.display = 'flex'; updateLiveList(); };
    
    prepareLiveBtn.onclick = async () => {
        if(userAge !== '18+') return alert("Only 18+ users can start a live stream.");
        const confirmRules = confirm("Live Stream Rules:\n1. No 18+ content.\n2. No harassment.\n3. Breaking rules results in a permanent ban.\n\nDo you agree?");
        if(confirmRules) startBroadcasting();
    };

    // Watch for new streams
    db.ref('live_streams').on('value', updateLiveList);
}

async function startBroadcasting() {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        liveVideo.srcObject = localStream;
        liveVideo.muted = true;
        isBroadcasting = true;
        
        livePlayerContainer.style.display = 'flex';
        liveOverlay.style.display = 'none';
        document.getElementById('streamerName').textContent = username + " (You)";
        
        // Register stream in DB
        const streamRef = db.ref(`live_streams/${username}`);
        streamRef.set({
            name: username,
            profileImage,
            viewers: 0,
            startedAt: Date.now()
        });
        streamRef.onDisconnect().remove();

        // Handle signaling for viewers
        db.ref(`live_signaling/${username}`).on('child_added', async snap => {
            const data = snap.val();
            if(data.offer) {
                const pc = new RTCPeerConnection(rtcConfig);
                peerConnections[snap.key] = pc;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                
                pc.onicecandidate = (e) => {
                    if(e.candidate) db.ref(`live_signaling/${username}/${snap.key}/candidates`).push(e.candidate.toJSON());
                };

                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                db.ref(`live_signaling/${username}/${snap.key}/answer`).set({ sdp: answer.sdp, type: answer.type });
            }
        });

        // Viewer Count logic
        db.ref(`live_streams/${username}/viewers`).on('value', s => { viewCountEl.textContent = s.val() || 0; });

    } catch (err) {
        showToast("Could not access camera/mic");
    }
}

async function watchStream(streamerName) {
    if(streamerName === username) return;
    
    livePlayerContainer.style.display = 'flex';
    liveOverlay.style.display = 'none';
    document.getElementById('streamerName').textContent = streamerName;
    stopLiveBtn.textContent = "Leave Stream";
    
    const pc = new RTCPeerConnection(rtcConfig);
    peerConnections['viewer'] = pc;
    
    pc.ontrack = (e) => { liveVideo.srcObject = e.streams[0]; liveVideo.muted = false; };
    
    const viewerId = username + "_" + Date.now();
    const sigRef = db.ref(`live_signaling/${streamerName}/${viewerId}`);
    
    pc.onicecandidate = (e) => {
        if(e.candidate) db.ref(`live_signaling/${streamerName}/${viewerId}/candidates`).push(e.candidate.toJSON());
    };

    const offer = await pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true });
    await pc.setLocalDescription(offer);
    sigRef.set({ offer: { sdp: offer.sdp, type: offer.type } });

    sigRef.child('answer').on('value', async s => {
        if(s.exists()) await pc.setRemoteDescription(new RTCSessionDescription(s.val()));
    });

    sigRef.child('candidates').on('child_added', s => {
        pc.addIceCandidate(new RTCIceCandidate(s.val()));
    });

    // Increment Viewers
    db.ref(`live_streams/${streamerName}/viewers`).transaction(v => (v || 0) + 1);
    
    stopLiveBtn.onclick = () => {
        db.ref(`live_streams/${streamerName}/viewers`).transaction(v => Math.max(0, (v || 1) - 1));
        cleanupStream();
    };
}

function updateLiveList() {
    db.ref('live_streams').once('value', snap => {
        liveUsersList.innerHTML = '';
        if(!snap.exists()) { liveUsersList.innerHTML = '<div style="text-align:center;color:var(--muted)">No one is live.</div>'; return; }
        
        snap.forEach(child => {
            const stream = child.val();
            const card = document.createElement('div');
            card.className = 'live-user-card';
            card.innerHTML = `
                <div style="width:40px;height:40px;border-radius:50%;background:#000;overflow:hidden">
                    ${stream.profileImage ? `<img src="${stream.profileImage}" style="width:100%;height:100%;object-fit:cover">` : ''}
                </div>
                <div style="flex:1">
                    <div style="font-weight:bold">${stream.name}</div>
                    <div style="font-size:11px;color:var(--muted)">${stream.viewers} watching</div>
                </div>
                <div class="live-badge">LIVE</div>
            `;
            card.onclick = () => watchStream(stream.name);
            liveUsersList.appendChild(card);
        });
    });
}

function cleanupStream() {
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    Object.values(peerConnections).forEach(pc => pc.close());
    peerConnections = {};
    if(isBroadcasting) db.ref(`live_streams/${username}`).remove();
    livePlayerContainer.style.display = 'none';
    isBroadcasting = false;
    liveVideo.srcObject = null;
}

stopLiveBtn.onclick = cleanupStream;
document.getElementById('liveFullScreen').onclick = () => { if(liveVideo.requestFullscreen) liveVideo.requestFullscreen(); };

function showToast(m) { toastEl.textContent = m; toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 2000); }
</script>
</body>
</html>
