<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WhatsApp Full Chat - Video Edition</title>
<style>
:root{--bg:#111b21;--panel:#202c33;--accent:#25d366;--muted:#97a4ab;--online:#25d366;--offline:#8696a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e9edef;font-family:Arial,system-ui;min-height:100vh;display:flex;flex-direction:column}

/* --- LOADER CSS --- */
#loader-wrapper { position: fixed; inset: 0; background: #0b141a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
.loader-wheel { width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #ffeb3b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#app{max-width:1100px;margin:0 auto;width:100%;height:100vh;display:flex;flex-direction:column;position:relative;}
#topBar{padding:8px 12px;background:#0b141a;display:flex;align-items:center;gap:12px;z-index:5}
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#071215}

/* VIDEO CALL SPECIFIC STYLES */
#callOverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #000; z-index: 10000; color: #fff; flex-direction: column; }
#videoContainer { position: relative; width: 100%; height: 100%; display: none; background: #000; }
#remoteVideo { width: 100%; height: 100%; object-fit: cover; }
#localVideo { position: absolute; top: 20px; right: 20px; width: 120px; height: 160px; border-radius: 12px; border: 2px solid var(--accent); object-fit: cover; z-index: 10; background: #222; }

.callCard { background: #071215; padding: 40px 20px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 90%; max-width: 450px; transition: all 0.3s; }
.callAvatar { width: 120px; height: 120px; border-radius: 50%; background: #2a3942; display: flex; align-items: center; justify-content: center; font-size: 50px; overflow: hidden; border: 3px solid var(--accent); }
.callAvatar img { width: 100%; height: 100%; object-fit: cover; }
.callBtns { display: flex; gap: 40px; margin-bottom: 20px; }
.circleBtn { width: 65px; height: 65px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
.btnAccept { background: var(--accent); color: #fff; }
.btnDecline { background: #ff3b30; color: #fff; }
.activeCallControls { position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 20; }
.ctrlBtn { width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border: none; color: #fff; cursor: pointer; font-size: 20px; }
.ctrlBtn.active { background: #fff; color: #000; }

/* ... Rest of your existing CSS (Keep your layout styles here) ... */
#loginWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);z-index:999}
#loginCard{background:#0b141a;padding:22px;border-radius:16px;display:flex;flex-direction:column;gap:12px;min-width:320px;border: 1px solid rgba(255,255,255,0.1)}
#loginCard input{padding:12px;border-radius:10px;border:0;background:#162027;color:#fff;outline:none}
#loginCard button{padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;font-weight:bold}
#inputBar{display:flex;padding:10px;background:var(--panel);align-items:center;gap:8px}
#messageInput{flex:1;padding:10px;border-radius:22px;border:0;background:#2a3942;color:#fff;outline:none}
#sendBtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer}
#privatePopup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:1000}
.card{background:#0b141a;padding:12px;border-radius:12px;width:96%;height:92%;display:flex;flex-direction:column}
#privateMessages{flex:1;overflow:auto;background:#071215;padding:10px;display:flex;flex-direction:column;gap:8px}
.private-bubble{background:#005c4b;color:#fff;padding:8px 12px;border-radius:10px;max-width:80%}
.private-row.self{align-self:flex-end}
</style>
</head>
<body>

<div id="loader-wrapper"><div class="loader-wheel"></div></div>

<div id="app">
    <div id="topBar">
        <div style="font-weight:bold">Group Chat</div>
        <div style="flex:1"></div>
        <div id="onlineCount">0 online</div>
    </div>
    <div id="messages"></div>
    <div id="inputBar">
        <input id="messageInput" placeholder="Type a message..."/>
        <button id="sendBtn">➤</button>
    </div>
</div>

<div id="loginWrap">
    <div id="loginCard">
        <input id="nameInput" placeholder="Enter name" />
        <button id="joinBtn">Join Chat</button>
    </div>
</div>

<div id="privatePopup">
    <div class="card">
        <div style="display:flex; align-items:center; padding-bottom:10px; border-bottom:1px solid #222">
            <button onclick="closePrivateChat()" style="background:none; border:0; color:var(--accent); font-size:20px">←</button>
            <div id="privateTitle" style="margin-left:10px; font-weight:bold">User</div>
            <div style="flex:1"></div>
            <button id="startVideoCall" style="background:none; border:0; font-size:22px; cursor:pointer">📹</button>
        </div>
        <div id="privateMessages"></div>
        <div style="display:flex; gap:10px; padding-top:10px">
            <input id="privateInput" style="flex:1; background:#2a3942; border:0; border-radius:20px; padding:10px; color:#fff" placeholder="Private message..."/>
            <button id="privateSend" style="background:var(--accent); border:0; width:40px; border-radius:50%">➤</button>
        </div>
    </div>
</div>

<div id="callOverlay">
    <div class="callCard" id="preCallCard">
        <div class="callAvatar" id="callAvatar">?</div>
        <div id="callFrom" style="font-size:24px; font-weight:bold">User</div>
        <div id="callStatusText" style="color:var(--accent)">Ringing...</div>
        <div class="callBtns" id="incomingBtns" style="display:none">
            <button class="circleBtn btnDecline" id="declineBtn">✕</button>
            <button class="circleBtn btnAccept" id="acceptBtn">✓</button>
        </div>
        <div class="callBtns" id="outgoingBtns">
            <button class="circleBtn btnDecline" id="cancelBtn">✕</button>
        </div>
    </div>

    <div id="videoContainer">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="activeCallControls">
            <button class="ctrlBtn" id="muteMicBtn">🎤</button>
            <button class="ctrlBtn" id="toggleCamBtn">📹</button>
            <button class="ctrlBtn btnDecline" id="endCallBtn">📞</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let username = localStorage.getItem('guestName') || '';
let localStream = null;
let peerConnection = null;
let activeCallId = null;
let privateChatWith = null;

const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// UI Elements
const callOverlay = document.getElementById('callOverlay');
const videoContainer = document.getElementById('videoContainer');
const preCallCard = document.getElementById('preCallCard');

// 1. START VIDEO CALL
document.getElementById('startVideoCall').onclick = async () => {
    if (!privateChatWith) return;
    const callId = db.ref('calls').push().key;
    activeCallId = callId;
    
    await db.ref(`calls/${callId}`).set({
        from: username,
        to: privateChatWith,
        status: 'ringing',
        type: 'video',
        timestamp: Date.now()
    });

    showOverlay(privateChatWith, 'outgoing');
    initiateWebRTC(callId, true);
};

// 2. INITIALIZE WEBRTC (VIDEO + AUDIO)
async function initiateWebRTC(callId, isCaller) {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        peerConnection = new RTCPeerConnection(rtcConfig);
        
        // Add tracks to connection
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        // When remote stream arrives
        peerConnection.ontrack = (event) => {
            document.getElementById('remoteVideo').srcObject = event.streams[0];
            preCallCard.style.display = 'none';
            videoContainer.style.display = 'block';
        };

        // ICE Candidates
        peerConnection.onicecandidate = (e) => {
            if (e.candidate) {
                db.ref(`calls/${callId}/candidates/${username}`).push(e.candidate.toJSON());
            }
        };

        // Listen for remote ICE Candidates
        const otherUser = isCaller ? privateChatWith : activeCallId_From; 
        db.ref(`calls/${callId}/candidates/${otherUser}`).on('child_added', snap => {
            peerConnection.addIceCandidate(new RTCIceCandidate(snap.val()));
        });

        if (isCaller) {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            db.ref(`calls/${callId}`).update({ offer: { sdp: offer.sdp, type: offer.type } });
        }

        // Handle Call Status Updates
        db.ref(`calls/${callId}/status`).on('value', snap => {
            if (snap.val() === 'ended' || snap.val() === 'declined') endCall();
            if (snap.val() === 'answered' && isCaller) {
                // Wait for answer SDP
                db.ref(`calls/${callId}/answer`).on('value', aSnap => {
                    if (aSnap.exists()) peerConnection.setRemoteDescription(new RTCSessionDescription(aSnap.val()));
                });
            }
        });

    } catch (err) {
        alert("Camera/Mic access required for video calls.");
        endCall();
    }
}

// 3. LISTEN FOR INCOMING CALLS
db.ref('calls').on('child_added', snap => {
    const call = snap.val();
    if (call.to === username && call.status === 'ringing') {
        activeCallId = snap.key;
        activeCallId_From = call.from;
        showOverlay(call.from, 'incoming');
        
        document.getElementById('acceptBtn').onclick = async () => {
            db.ref(`calls/${snap.key}`).update({ status: 'answered' });
            await initiateWebRTC(snap.key, false);
            
            // Handle Offer
            db.ref(`calls/${snap.key}/offer`).once('value', async oSnap => {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(oSnap.val()));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                db.ref(`calls/${snap.key}`).update({ answer: { sdp: answer.sdp, type: answer.type } });
            });
        };
    }
});

// UI HELPER
function showOverlay(name, mode) {
    callOverlay.style.display = 'flex';
    document.getElementById('callFrom').textContent = name;
    preCallCard.style.display = 'flex';
    videoContainer.style.display = 'none';
    document.getElementById('incomingBtns').style.display = mode === 'incoming' ? 'flex' : 'none';
    document.getElementById('outgoingBtns').style.display = mode === 'outgoing' ? 'flex' : 'none';
}

function endCall() {
    if (activeCallId) db.ref(`calls/${activeCallId}`).update({ status: 'ended' });
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (peerConnection) peerConnection.close();
    callOverlay.style.display = 'none';
    videoContainer.style.display = 'none';
    activeCallId = null;
    location.reload(); // Refresh to clean up memory
}

document.getElementById('endCallBtn').onclick = endCall;
document.getElementById('declineBtn').onclick = endCall;
document.getElementById('cancelBtn').onclick = endCall;

// --- Your Existing Chat Logic ---
function openPrivatePopup(other) {
    privateChatWith = other;
    document.getElementById('privateTitle').textContent = other;
    document.getElementById('privatePopup').style.display = 'flex';
}

function closePrivateChat() {
    document.getElementById('privatePopup').style.display = 'none';
}

// Join logic
document.getElementById('joinBtn').onclick = () => {
    const n = document.getElementById('nameInput').value.trim();
    if (n) {
        username = n;
        localStorage.setItem('guestName', n);
        document.getElementById('loginWrap').style.display = 'none';
        db.ref(`status/${n}`).set(true);
    }
};

window.onload = () => {
    if (username) document.getElementById('loginWrap').style.display = 'none';
    setTimeout(() => document.getElementById('loader-wrapper').style.display = 'none', 1000);
};
</script>
</body>
</html>
