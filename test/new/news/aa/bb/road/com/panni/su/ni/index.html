<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil VM FM - Premium Live Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --fav-color: #fbbf24;
            --transition: all 0.3s ease;
        }

        .light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #0284c7;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            transition: var(--transition);
        }

        /* --- Loader --- */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        #loader img { width: 80px; filter: drop-shadow(0 0 10px var(--accent-color)); }

        /* --- Header & Navigation --- */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(11, 17, 32, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .logo { font-weight: 600; font-size: 1.2rem; color: var(--accent-color); }

        .nav-buttons { display: flex; gap: 10px; }

        button {
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-fav { background: var(--fav-color); color: #000; }
        .btn-mode { background: var(--card-bg); color: var(--text-color); border: 1px solid rgba(255,255,255,0.1); }
        button:active { transform: scale(0.95); }

        /* --- Grid System --- */
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Force 3 columns */
            gap: 15px;
        }

        .station-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 10px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            overflow: hidden;
        }

        .station-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .station-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
            display: block;
        }

        .station-info {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .favorite-heart {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: var(--transition);
        }

        .favorite-heart:hover { transform: scale(1.2); }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 30px;
            font-size: 12px;
            opacity: 0.6;
        }

        /* Responsive tweak for very small screens */
        @media (max-width: 360px) {
            .station-grid { gap: 8px; }
            .station-info { font-size: 9px; }
        }
    </style>
</head>
<body>

<div id="loader">
    <img src="https://vmfm.github.io/tamil/Images/loading3.gif" alt="Loading">
</div>

<header>
    <div class="logo">TAMIL VM FM</div>
    <div class="nav-buttons">
        <button class="btn-fav" onclick="window.location.href='go:fave'">⭐ Favs</button>
        <button class="btn-mode" onclick="toggleMode()">🌓</button>
    </div>
</header>

<div class="container" id="content" style="display:none;">
    <div class="station-grid" id="main-grid">
        </div>

    <footer>
        &copy; 2026 Designed by TAMILVM
    </footer>
</div>

<script>
    // Station Data Array (Easier to manage than repeating HTML)
    const stations = [
        { name: "KARAIKAL FM", img: "airkaaraikalfm1.jpg", link: "go:kaarai" },
        { name: "TRICHY FM", img: "airtrichyfm.jpg", link: "go:trichy" },
        { name: "DHARMA FM", img: "airdharmaburifm.jpg", link: "go:dharm" },
        { name: "KUMARI FM", img: "airnagercovilfm.jpg", link: "go:nagerfm" },
        { name: "CHENNAI FM", img: "airchennaifm.jpg", link: "go:chennaifm" },
        { name: "NELLAI FM", img: "airtrinelvelyfm.jpg", link: "go:nellaifm" },
        { name: "COVAI FM", img: "aircoimbaturefm.jpg", link: "go:covaifm" },
        { name: "OOTY FM", img: "airootyfm.jpg", link: "go:ootyfm" },
        { name: "MADURAI FM", img: "airmaduraifm.jpg", link: "go:Fmmadu" },
        { name: "TAMILNA FM", img: "airtamilnadufm.jpg", link: "go:airtamilna" },
        { name: "AIR TAMIL", img: "airtamillivefm.jpg", link: "go:airtamil" },
        { name: "AIRGOLD FM", img: "airgoldfm.jpg", link: "go:airgold" },
        { name: "VIVIDH FM", img: "airtrichyfm.jpg", link: "go:vividhbhar" },
        { name: "KODAI FM", img: "airKodaikanalfm.jpg", link: "go:kodai" },
        { name: "TNVIBE FM", img: "tnvibefm-1.jpg", link: "go:tnvibefm" },
        { name: "PUDUGAI CITY", img: "pudhugai.jpg", link: "go:pudugaicit" },
        { name: "RADIOPETTI", img: "radiopetti1.jpg", link: "go:RadioPett" },
        { name: "THENI FM", img: "thenifm.jpg", link: "go:thenifm" },
        { name: "SIVAGA FM", img: "ssradiosivagangai.png", link: "go:sivaganga" },
        { name: "PERAMB FM", img: "perambalurfm.png", link: "go:peram" },
        { name: "THIRUDAN FM", img: "thirudanfm.png", link: "go:thirudan" },
        { name: "VIRUDHA FM", img: "virudhairadio.jpg", link: "go:virudhai" },
        { name: "PSTAMIL FM", img: "pstamilradio.png", link: "go:PSTamilR" },
        { name: "JAI FM", img: "erodejaifm.jpg", link: "go:erodejai" },
        { name: "ISAIPA FM", img: "isaiparavai-1.jpg", link: "go:isaiparava" },
        { name: "TAMILAI FM", img: "tamilaifm-1.jpg", link: "go:tamilaifm" },
        { name: "TAMIZ FM", img: "tamizenradio.png", link: "go:Tamizen" },
        { name: "SSNATHAM FM", img: "mathamradio.jpeg", link: "go:NTMRadio" },
        { name: "HARI FM", img: "haritamilfm-1.jpg", link: "go:harifm" },
        { name: "REMIX FM", img: "tamilremixhitsfm.jpeg", link: "go:TamilRemi" },
        { name: "MEGAZON FM", img: "megazonesouthnew-1.jpg", link: "go:megazon" },
        { name: "DINDUGAL FM", img: "dindugalfm.jpeg", link: "go:Dindigul" },
        { name: "KOTTAR FM", img: "FM%20Kottarakkara.png", link: "go:FMKottara" },
        { name: "GINGEE FM", img: "gingeefm.jpg", link: "go:GingeeFm" },
        { name: "SUBAG FM", img: "subageetham.jpeg", link: "go:subagee" },
        { name: "NAMMA FM", img: "nammaradio.png", link: "go:nammaradio" },
        { name: "VAANAVIL2 FM", img: "vaanavilvaanoli-1.png", link: "go:vaanavil2" },
        { name: "MANNAI FM", img: "mannaifm.jpg", link: "go:mannaifm" },
        { name: "BRITISH FM", img: "British%20Indian%20Tamil%20Radio%202-1.png", link: "go:British" },
        { name: "CHILLAX FM", img: "chillaxfm1.png", link: "go:chillax" },
        { name: "MINNAL FM", img: "vallioorminnalfm.png", link: "go:Vallioor" },
        { name: "MAGIZH FM", img: "magizhfm.jpeg", link: "go:Magizh" },
        { name: "SKYWAY FM", img: "Skyway%20Tamil%20FM%20(1).jpg", link: "go:Skyway" }
    ];

    const baseUrl = "https://vmfm.github.io/tamil/Images/";
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

    // Initialize Page
    window.onload = function () {
        renderStations();
        setTimeout(() => {
            document.getElementById("loader").style.display = "none";
            document.getElementById("content").style.display = "block";
        }, 1200);
    };

    function renderStations() {
        const grid = document.getElementById("main-grid");
        grid.innerHTML = stations.map(s => {
            const isFav = favorites.some(f => f.name === s.name);
            const fullImgUrl = s.img.startsWith('http') ? s.img : baseUrl + s.img;
            return `
                <div class="station-card">
                    <span class="favorite-heart" 
                          onclick="toggleFav(this, '${s.name}', '${fullImgUrl}', '${s.link}')">
                          ${isFav ? '⭐' : '☆'}
                    </span>
                    <a href="${s.link}">
                        <img src="${fullImgUrl}" loading="lazy" alt="${s.name}">
                        <div class="station-info">${s.name}</div>
                    </a>
                </div>
            `;
        }).join('');
    }

    function toggleFav(element, name, img, link) {
        let exists = favorites.findIndex(fav => fav.name === name);
        if (exists > -1) {
            favorites.splice(exists, 1);
            element.textContent = "☆";
        } else {
            favorites.push({ name, img, link });
            element.textContent = "⭐";
        }
        localStorage.setItem("favorites", JSON.stringify(favorites));
    }

    function toggleMode() {
        document.body.classList.toggle("light-mode");
    }
</script>

</body>
</html>
