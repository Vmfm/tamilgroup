<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tamil Group - Live Stream</title>
<style>
:root{--bg:#111b21;--panel:#202c33;--accent:#25d366;--muted:#97a4ab;--online:#25d366;--offline:#8696a0;--live:#ff3b30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e9edef;font-family:Arial,system-ui;overflow-x:hidden}

/* --- LOADER --- */
#loader-wrapper { position: fixed; inset: 0; background: #0b141a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
.loader-wheel { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top: 5px solid #ffeb3b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* --- APP LAYOUT --- */
#app{max-width:1100px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative}
#topBar{padding:12px;background:#0b141a;display:flex;align-items:center;justify-content:space-between;z-index:5;border-bottom:1px solid rgba(255,255,255,0.05)}
.top-btn{background:rgba(255,255,255,0.05);border:none;color:#fff;padding:8px 12px;border-radius:20px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.live-indicator{width:8px;height:8px;background:var(--live);border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.3}}

/* --- STREAM GRID --- */
#streamSection{flex:1;padding:15px;overflow-y:auto;background:#071215}
.section-title{font-size:18px;font-weight:bold;margin-bottom:15px;display:flex;align-items:center;gap:10px}
#streamGrid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px}
.stream-card{background:var(--panel);border-radius:12px;overflow:hidden;position:relative;aspect-ratio:3/4;cursor:pointer;border:1px solid rgba(255,255,255,0.05)}
.stream-card img, .stream-card video{width:100%;height:100%;object-fit:cover}
.stream-info{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent, rgba(0,0,0,0.8));font-size:12px}
.stream-tag{position:absolute;top:8px;left:8px;background:var(--live);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:bold}

/* --- STREAM OVERLAY --- */
#streamOverlay{position:fixed;inset:0;background:#000;z-index:5000;display:none;flex-direction:column}
#mainVideo{width:100%;height:100%;object-fit:contain}
.stream-controls{position:absolute;bottom:30px;left:0;right:0;display:flex;justify-content:center;gap:20px;z-index:5001}
.round-btn{width:60px;height:60px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.btn-stop{background:var(--live);color:#fff}
.btn-close{background:rgba(255,255,255,0.2);color:#fff}

/* --- MOBILE TABS --- */
#navBar{display:flex;background:var(--panel);border-top:1px solid rgba(255,255,255,0.05);padding:10px 0}
.nav-item{flex:1;text-align:center;font-size:11px;color:var(--muted);cursor:pointer}
.nav-item.active{color:var(--accent)}
.nav-icon{font-size:20px;display:block;margin-bottom:4px}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2a3942;padding:10px 20px;border-radius:20px;z-index:9999;display:none}
</style>
</head>
<body>

<div id="loader-wrapper"><div class="loader-wheel"></div><div style="color:#ffeb3b">Connecting to Stream Hub...</div></div>

<div id="app">
    <div id="topBar">
        <div style="font-weight:700;font-size:18px">TAMIL <span style="color:var(--accent)">VM</span></div>
        <button class="top-btn" id="goLiveBtn"><span class="live-indicator"></span> Go Live</button>
    </div>

    <div id="streamSection">
        <div class="section-title">🔥 Live Users</div>
        <div id="streamGrid">
            <!-- Dynamic Streamers List -->
        </div>
    </div>

    <div id="navBar">
        <div class="nav-item active"><span class="nav-icon">📺</span>Live</div>
        <div class="nav-item" onclick="location.href='index.html'"><span class="nav-icon">💬</span>Chat</div>
        <div class="nav-item"><span class="nav-icon">👤</span>Profile</div>
    </div>
</div>

<div id="streamOverlay">
    <div id="viewerCount" style="position:absolute;top:20px;right:20px;background:rgba(0,0,0,0.5);padding:5px 12px;border-radius:15px;font-size:12px;z-index:5001">👁️ 0</div>
    <video id="mainVideo" autoplay playsinline></video>
    <div class="stream-controls">
        <button class="round-btn btn-close" id="closeStream">✕</button>
        <button class="round-btn btn-stop" id="stopLive" style="display:none">⏹</button>
    </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const username = localStorage.getItem('guestName') || 'Guest' + Math.floor(Math.random()*1000);
const profileImg = localStorage.getItem('profileImage') || '';

let localStream = null;
let peerConnection = null;
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// --- UI LOGIC ---
window.onload = () => {
    setTimeout(() => document.getElementById('loader-wrapper').style.display='none', 1000);
    listenForStreams();
};

function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); }

// --- LIVE STREAMING LOGIC ---
const goLiveBtn = document.getElementById('goLiveBtn');
const streamOverlay = document.getElementById('streamOverlay');
const mainVideo = document.getElementById('mainVideo');
const stopLive = document.getElementById('stopLive');
const closeStream = document.getElementById('closeStream');

goLiveBtn.onclick = async () => {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        mainVideo.srcObject = localStream;
        streamOverlay.style.display = 'flex';
        stopLive.style.display = 'flex';
        
        // Register stream in Firebase
        db.ref(`liveStreams/${username}`).set({
            name: username,
            image: profileImg,
            status: 'online',
            startedAt: Date.now()
        });
        
        db.ref(`liveStreams/${username}`).onDisconnect().remove();
        showToast("You are now LIVE!");
    } catch (e) {
        showToast("Camera permission denied");
    }
};

stopLive.onclick = () => {
    if(localStream) {
        localStream.getTracks().forEach(t => t.stop());
        db.ref(`liveStreams/${username}`).remove();
        streamOverlay.style.display = 'none';
        showToast("Stream ended");
    }
};

closeStream.onclick = () => {
    streamOverlay.style.display = 'none';
    if(peerConnection) peerConnection.close();
    mainVideo.srcObject = null;
};

// --- WATCHER LOGIC ---
function listenForStreams() {
    const grid = document.getElementById('streamGrid');
    db.ref('liveStreams').on('value', snap => {
        grid.innerHTML = '';
        const streams = snap.val();
        if(!streams) {
            grid.innerHTML = '<div style="grid-column:span 3;text-align:center;color:var(--muted);margin-top:20px">No active streams</div>';
            return;
        }
        
        Object.keys(streams).forEach(userId => {
            const data = streams[userId];
            const card = document.createElement('div');
            card.className = 'stream-card';
            card.innerHTML = `
                <div class="stream-tag">LIVE</div>
                ${data.image ? `<img src="${data.image}">` : `<div style="height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;background:#2a3942">${data.name[0]}</div>`}
                <div class="stream-info">
                    <b>${data.name}</b>
                </div>
            `;
            card.onclick = () => joinStream(userId);
            grid.appendChild(card);
        });
    });
}

async function joinStream(streamerId) {
    if(streamerId === username) return;
    streamOverlay.style.display = 'flex';
    stopLive.style.display = 'none';
    showToast(`Joining ${streamerId}'s stream...`);
    
    peerConnection = new RTCPeerConnection(rtcConfig);
    peerConnection.ontrack = (e) => { mainVideo.srcObject = e.streams[0]; };
    
    // WebRTC signaling via Firebase (simplified for direct code integration)
    const offerSnap = await db.ref(`calls/stream_${streamerId}`).once('value');
    // In a full implementation, you would handle the Offer/Answer exchange here
    // similar to your private call logic.
}
</script>
</body>
</html>
