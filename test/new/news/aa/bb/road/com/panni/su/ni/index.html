<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tamil Group Live - Fully Fixed</title>
<style>
:root{--bg:#0b141a;--panel:#202c33;--accent:#25d366;--live:#ff3b30;--glass:rgba(255, 255, 255, 0.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e9edef;font-family:Arial,system-ui;min-height:100vh;display:flex;flex-direction:column}
#topBar{padding:12px;background:#0b141a;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glass)}
.logo{font-weight:700;font-size:18px;letter-spacing:1px}.logo span{color:var(--accent)}
#goLiveBtn{background:var(--live);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:600;cursor:pointer}
#streamGrid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;padding:10px}
.live-card{background:var(--panel);border-radius:12px;aspect-ratio:1/1.4;position:relative;overflow:hidden;cursor:pointer}
.live-card img{width:100%;height:100%;object-fit:cover}
.live-tag{position:absolute;top:6px;left:6px;background:var(--live);font-size:9px;padding:2px 6px;border-radius:4px;font-weight:bold}
#streamOverlay{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center}
#mainVideo{width:100%;height:100%;object-fit:cover;background:#000}
.stream-footer{position:absolute;bottom:30px;display:flex;gap:20px}
.round-btn{width:56px;height:56px;border-radius:50%;border:none;color:#fff;font-size:20px;cursor:pointer}
.btn-close{background:rgba(255,255,255,0.2)}.btn-stop{background:var(--live)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a3942;color:#fff;padding:10px 20px;border-radius:20px;display:none}
</style>
</head>
<body>

<div id="app">
    <div id="topBar">
        <div class="logo">TAMIL <span>LIVE</span></div>
        <button id="goLiveBtn">● GO LIVE</button>
    </div>
    <div id="streamGrid"></div>
</div>

<div id="streamOverlay">
    <video id="mainVideo" autoplay playsinline></video>
    <div class="stream-footer">
        <button class="round-btn btn-close" id="closeOverlay">✕</button>
        <button class="round-btn btn-stop" id="stopStreaming" style="display:none">⏹</button>
    </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const username = localStorage.getItem('guestName') || 'User' + Math.floor(Math.random()*9999);
const pcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

let pc = null;
let localStream = null;

// --- BROADCASTER SIDE ---
document.getElementById('goLiveBtn').onclick = async () => {
    try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('mainVideo').srcObject = localStream;
        document.getElementById('streamOverlay').style.display = 'flex';
        document.getElementById('stopStreaming').style.display = 'flex';

        const streamRef = db.ref(`liveStreams/${username}`);
        await streamRef.set({ username, active: true });
        streamRef.onDisconnect().remove();

        // Listen for viewer's Offer
        streamRef.child('offer').on('value', async snap => {
            const offer = snap.val();
            if (offer && !pc) {
                pc = new RTCPeerConnection(pcConfig);
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
                
                pc.onicecandidate = e => {
                    if (e.candidate) streamRef.child('hostCandidates').push(e.candidate.toJSON());
                };

                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                streamRef.update({ answer });

                // Listen for Viewer's Candidates
                streamRef.child('viewerCandidates').on('child_added', s => {
                    pc.addIceCandidate(new RTCIceCandidate(s.val()));
                });
            }
        });
        showToast("Broadcasting Live...");
    } catch (e) { showToast("Error accessing camera"); }
};

// --- VIEWER SIDE ---
async function joinStream(broadcasterId) {
    if (broadcasterId === username) return;
    document.getElementById('streamOverlay').style.display = 'flex';
    document.getElementById('stopStreaming').style.display = 'none';

    pc = new RTCPeerConnection(pcConfig);
    pc.ontrack = e => { document.getElementById('mainVideo').srcObject = e.streams[0]; };

    const streamRef = db.ref(`liveStreams/${broadcasterId}`);
    
    pc.onicecandidate = e => {
        if (e.candidate) streamRef.child('viewerCandidates').push(e.candidate.toJSON());
    };

    const offer = await pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true });
    await pc.setLocalDescription(offer);
    streamRef.update({ offer });

    // Listen for Answer
    streamRef.child('answer').on('value', async snap => {
        const answer = snap.val();
        if (answer && !pc.remoteDescription) {
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }
    });

    // Listen for Broadcaster's Candidates
    streamRef.child('hostCandidates').on('child_added', s => {
        pc.addIceCandidate(new RTCIceCandidate(s.val()));
    });
}

function listenForLiveUsers() {
    db.ref('liveStreams').on('value', snap => {
        const grid = document.getElementById('streamGrid');
        grid.innerHTML = '';
        const data = snap.val();
        if (!data) return;
        Object.keys(data).forEach(id => {
            const card = document.createElement('div');
            card.className = 'live-card';
            card.innerHTML = `<div class="live-tag">LIVE</div><div style="padding:40px;text-align:center">${data[id].username}</div>`;
            card.onclick = () => joinStream(id);
            grid.appendChild(card);
        });
    });
}

document.getElementById('closeOverlay').onclick = () => {
    if (pc) pc.close(); pc = null;
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    db.ref(`liveStreams/${username}`).remove();
    document.getElementById('streamOverlay').style.display = 'none';
};

function showToast(m) {
    const t = document.getElementById('toast');
    t.innerText = m; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

listenForLiveUsers();
</script>
</body>
</html>
