<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WhatsApp Full Chat</title>
<style>
:root{--bg:#111b21;--panel:#202c33;--accent:#25d366;--muted:#97a4ab;--online:#25d366;--offline:#8696a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e9edef;font-family:Arial,system-ui;min-height:100vh;display:flex;flex-direction:column}

/* --- LOADER CSS --- */
#loader-wrapper { position: fixed; inset: 0; background: #0b141a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
.loader-wheel { width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #ffeb3b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
.loader-text { color: #ffeb3b; font-size: 14px; font-weight: 500; letter-spacing: 1px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#app{max-width:1100px;margin:0 auto;width:100%;height:100vh;display:flex;flex-direction:column;position:relative;transition:transform .28s ease}
#topBar{padding:8px 12px;background:#0b141a;display:flex;align-items:center;gap:12px;z-index:5}
#title{font-weight:600;display:flex;align-items:center;gap:10px}
#notifWrap{display:flex;align-items:center;gap:8px}
.bell{position:relative;cursor:pointer;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.04)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:12px;background:#ff3b30;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.6)}

#onlineCount { background: rgba(37, 211, 102, 0.1); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid rgba(37, 211, 102, 0.3); font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
#onlineCount:hover { background: rgba(37, 211, 102, 0.2); }
#onlineCount::before { content: ''; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; display: inline-block; }

#panel{position:fixed;right:0;top:0;height:100vh;width:360px;background:#081214;border-left:1px solid rgba(255,255,255,.03);transform:translateX(100%);transition:transform .28s ease;z-index:20;box-shadow:-20px 0 60px rgba(0,0,0,.6);display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
.panelHeader{padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.03);display:flex;align-items:center;gap:8px}
.panelTitle{font-weight:700}
.panelClose{margin-left:auto;background:none;border:0;color:var(--accent);cursor:pointer;font-size:18px}
.panelList{padding:8px;overflow:auto;flex:1}
.panelItem{padding:10px;border-radius:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.panelItem:hover{background:rgba(255,255,255,.02)}
.panelItem .who{flex:1}
.panelItem .count{background:#ff3b30;color:#fff;border-radius:12px;padding:2px 8px;font-size:12px}
#clearHistoryBtn{background:transparent;border:1px solid #ff3b30;color:#ff3b30;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;margin-right:10px;transition:all 0.2s}
#clearHistoryBtn:hover{background:#ff3b30;color:#fff}
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#071215}
.msg-row{display:flex;align-items:flex-end;max-width:80%;position:relative}
.msg-row.self{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 8px;position:relative;cursor:pointer;border:2px solid transparent;transition:border .18s ease-in-out;overflow:hidden}
.avatar.online{border-color:var(--accent);box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 6px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.bubble{background:var(--panel);padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.3;word-break:break-word;position:relative}
.bubble audio{max-width:200px;height:35px;margin-top:5px;display:block}
.bubble img.sticker-img{max-width:120px;display:block;margin:5px 0}
.msg-row.self .bubble{background:#005c4b}
.meta{font-size:12px;color:#53bdeb;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.time{font-size:11px;color:var(--muted);margin-top:6px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.read-status{font-size:14px;line-height:1}
.read-status.read{color:#53bdeb}
#inputBar{display:flex;padding:10px;background:var(--panel);align-items:center;gap:8px;position:relative}
#messageInput{flex:1;padding:10px;border-radius:22px;border:0;background:#2a3942;color:#fff;outline:none;font-size:14px}
#sendBtn, .groupMediaBtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.groupMediaBtn{background:#2a3942;font-size:20px}
#statusLine{padding:6px 12px;font-size:13px;color:var(--muted);background:#071215}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#2a3942;color:#fff;padding:10px 14px;border-radius:10px;z-index:999;opacity:0;transition:opacity .25s,bottom .25s}
#toast.show{opacity:1;bottom:40px}

/* --- LOGIN WRAP --- */
#loginWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:999}
#loginCard{background:#0b141a;padding:22px;border-radius:16px;display:flex;flex-direction:column;gap:12px;min-width:320px;box-shadow: 0 10px 40px rgba(0,0,0,0.8);border: 1px solid rgba(255,255,255,0.05)}
#loginCard input, #loginCard select{padding:12px;border-radius:10px;border:0;background:#162027;color:#fff;outline:none}
#loginCard input:disabled{opacity:0.5; cursor:not-allowed;}
#loginCard button{padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer;font-weight:bold}
.reg-msg {font-size: 11px; color: #ffeb3b; text-align: center; display: none; margin-top: -5px;}

#settingsWrap{position:relative}
#settingsBtn{cursor:pointer;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.04);background:transparent;color:var(--muted)}
#settingsPanel{position:absolute;right:0;top:48px;background:#0b141a;border:1px solid rgba(255,255,255,.1);padding:12px;border-radius:12px;display:none;z-index:100;min-width:260px;box-shadow: 0 8px 24px rgba(0,0,0,0.5)}
.settingRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.settingRow:last-child{border-bottom:none}
.toggleBtn{width:46px;height:26px;border-radius:16px;background:#2a3942;position:relative;cursor:pointer;flex-shrink:0}
.toggleKnob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s}
#logoutBtn{width:100%;background:#ff3b30;color:#fff;border:0;padding:8px;border-radius:8px;margin-top:10px;cursor:pointer;font-weight:600}
#privatePopup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:1000}
.card{background:#0b141a;padding:12px;border-radius:12px;max-width:680px;width:96%;display:flex;flex-direction:column;max-height:92%}
#privateHeader{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.user-info-mini {display:flex; flex-direction:column; gap:2px}
.online-dot {width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px}
.status-text {font-size:11px; color:var(--muted)}
#privateMessages{flex:1;overflow:auto;padding:8px;background:#071215;border-radius:8px;display:flex;flex-direction:column;gap:8px}
.private-bubble{background:#162027;padding:8px 10px;border-radius:10px;max-width:80%;cursor:pointer;position:relative}
.private-row.self{align-self:flex-end}
#privateInputBar{display:flex;gap:8px;margin-top:8px;align-items:center}
#privateInput{flex:1;padding:10px;border-radius:22px;border:0;background:#2a3942;color:#fff}
#privateSend, .mediaBtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mediaBtn{background:#2a3942;font-size:18px}
#micBtn.recording, #groupMicBtn.recording{background:#ff3b30;animation:pulse 1s infinite}
#privateMessages img{max-width:200px;border-radius:8px;margin-top:5px;display:block}
#privateMessages audio{max-width:240px;height:35px;margin-top:5px}
.headerActionBtn { background: none; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
#blockBtn.blocked { border-color: #25d366; color: #25d366; }
#blockBtn.not-blocked { border-color: #ff3b30; color: #ff3b30; }
#reportBtn { border-color: #eab308; color: #eab308; }

/* --- CALL OVERLAY --- */
#callOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;z-index:10000;flex-direction:column;color:#fff}
.callCard{background:#071215;padding:40px 20px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:20px;width:90%;max-width:450px;height:70%;justify-content: space-between;transition: all 0.3s;position:relative;overflow:hidden;z-index: 5;}
.callCard.connected-video { background: transparent; width: 100%; height: 100%; max-width: 100%; border-radius: 0; padding: 20px; }
.callAvatar{width:120px;height:120px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden;border:3px solid var(--accent);z-index: 2;}
.callAvatar img{width:100%;height:100%;object-fit:cover}
#remoteVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; background: #000; z-index: 1; }
#localVideo { position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; object-fit: cover; border-radius: 12px; border: 2px solid var(--accent); display: none; z-index: 10; background: #222;}
.callName{font-size:24px;font-weight:700;z-index: 2;}
.callStatusText{font-size:16px;color:var(--accent);margin-top:-10px;z-index: 2;}
.callBtns{display:flex;gap:40px;margin-bottom:20px;z-index: 6;}
.circleBtn{width:65px;height:65px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:transform 0.2s}
.btnAccept{background:var(--accent);color:#fff}
.btnDecline{background:#ff3b30;color:#fff}
.callControls{display:flex;gap:20px;margin-top:20px;z-index: 6;}
.ctrlBtn{width:50px;height:50px;border-radius:50%;background:rgba(42, 57, 66, 0.8);border:none;color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.ctrlBtn.active{background:#fff;color:#000}

#deleteModal{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:10001;display:none;align-items:center;justify-content:center}
.deleteCard{background:#202c33;padding:24px;border-radius:16px;width:300px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.deleteBtns{display:flex;justify-content:flex-end;gap:20px}
.deleteBtns button{background:none;border:none;font-weight:600;font-size:14px;cursor:pointer;padding:8px;text-transform:uppercase}
#cancelDel{color:var(--accent)}
#confirmDel{color:var(--accent)}

/* --- STICKER PICKER --- */
#stickerPicker { position: absolute; bottom: 60px; left: 10px; background: #202c33; padding: 10px; border-radius: 12px; display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 100; max-height: 250px; overflow-y: auto; width: 240px; border: 1px solid rgba(255,255,255,0.1); }
.sticker-item { width: 100%; aspect-ratio: 1; cursor: pointer; object-fit: contain; border-radius: 4px; transition: transform 0.2s; }
.sticker-item:hover { transform: scale(1.1); background: rgba(255,255,255,0.05); }

@media(max-width:600px){ #panel{width:100%} }
</style>
</head>
<body>

<div id="loader-wrapper"><div class="loader-wheel"></div><div class="loader-text">Loading...</div></div>

<div id="deleteModal"><div class="deleteCard"><h3>Delete message for everyone?</h3><div class="deleteBtns"><button id="cancelDel">Cancel</button><button id="confirmDel">Delete</button></div></div></div>

<div id="panel"><div class="panelHeader"><div class="panelTitle">Private Messages</div><button id="clearHistoryBtn">Clear History</button><button id="panelClose" class="panelClose">✕</button></div><div class="panelList" id="panelList"></div></div>

<div id="app">
    <div id="topBar">
        <div id="title">Group Chat</div>
        <div style="flex:1"></div>
        <div id="notifWrap">
            <div class="bell" id="bellBtn">🔔<div class="badge" id="bellBadge" style="display:none">0</div></div>
            <div id="settingsWrap">
                <button id="settingsBtn">⚙️</button>
                <div id="settingsPanel">
                    <div class="settingRow"><div>Audio</div><div class="toggleBtn" id="toggleCall"><div class="toggleKnob" id="toggleCallKnob"></div></div></div>
                    <div class="settingRow"><div>Video</div><div class="toggleBtn" id="toggleVideo"><div class="toggleKnob" id="toggleVideoKnob"></div></div></div>
                    <div class="settingRow"><div>Private Chat</div><div class="toggleBtn" id="togglePrivate"><div class="toggleKnob" id="togglePrivateKnob"></div></div></div>
                    <div class="settingRow"><div>Tones</div><div class="toggleBtn" id="toggleTone"><div class="toggleKnob" id="toggleToneKnob"></div></div></div>
                    <button id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
        <div id="onlineCount">0 online</div>
    </div>
    <div id="statusLine"></div>
    <div id="messages"></div>
    <div id="inputBar">
        <div id="stickerPicker"></div>
        <button class="groupMediaBtn" id="stickerBtn">🎭</button>
        <input id="messageInput" placeholder="Type a message" autocomplete="off"/>
        <button id="sendBtn">➤</button>
    </div>
</div>

<div id="loginWrap">
    <div id="loginCard">
        <h3 style="text-align:center;margin:0">Join Chat</h3>
        <input id="nameInput" placeholder="Enter name" />
        <p id="regNotice" class="reg-msg"></p>
        <select id="ageSelect"><option value="18+">18+</option><option value="Under 18">Under 18</option></select>
        <button id="joinBtn">Join</button>
    </div>
</div>

<div id="privatePopup">
    <div class="card">
        <div id="privateHeader">
            <button id="closePrivate" style="background:none;border:0;color:var(--accent);font-size:18px">⬅</button>
            <div class="user-info-mini"><div id="privateTitle" style="font-weight:700"></div><div class="status-text"></div></div>
            <div style="flex:1"></div>
            <button id="blockBtn" class="headerActionBtn">Block</button>
        </div>
        <div id="privateMessages"></div>
        <div id="privateInputBar">
            <input id="privateInput" placeholder="Message..." autocomplete="off"/>
            <button id="privateSend">➤</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let username = localStorage.getItem('guestName') || '';
let profileImage = localStorage.getItem('profileImage') || '';
let isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';

// UI Elements
const loader = document.getElementById('loader-wrapper');
const loginWrap = document.getElementById('loginWrap');
const nameInput = document.getElementById('nameInput');
const joinBtn = document.getElementById('joinBtn');
const regNotice = document.getElementById('regNotice');
const messagesEl = document.getElementById('messages');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');

window.onload = () => {
    setTimeout(() => {
        loader.style.display = 'none';
        checkAutoLogin();
    }, 1500);
};

function checkAutoLogin() {
    // Logic: If they have a name and didn't log out, log them in automatically
    if (username && isLoggedIn) {
        startChat();
    } else if (username && !isLoggedIn) {
        // Device registered but they logged out
        loginWrap.style.display = 'flex';
        nameInput.value = username;
        nameInput.disabled = true;
        regNotice.style.display = 'block';
        regNotice.innerHTML = `This device is registered to <b>${username}</b>. You cannot change your username.`;
    } else {
        // First time user
        loginWrap.style.display = 'flex';
    }
}

joinBtn.onclick = () => {
    const name = nameInput.value.trim();
    if (!name) return alert("Enter name");
    
    username = name;
    localStorage.setItem('guestName', name);
    sessionStorage.setItem('isLoggedIn', 'true');
    isLoggedIn = true;
    startChat();
};

function startChat() {
    loginWrap.style.display = 'none';
    db.ref(`status/${username}`).set(true);
    db.ref(`status/${username}`).onDisconnect().remove();
    
    // Load existing messages
    db.ref('messages').limitToLast(50).on('child_added', snap => {
        renderMessage(snap.val(), snap.key);
    });
    
    // Online count
    db.ref('status').on('value', snap => {
        document.getElementById('onlineCount').textContent = `${Object.keys(snap.val()||{}).length} online`;
    });
}

function renderMessage(data, key) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (data.name === username ? ' self' : '');
    row.innerHTML = `<div class="bubble"><b>${data.name}</b><br>${data.text}</div>`;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

sendBtn.onclick = () => {
    const text = messageInput.value.trim();
    if (!text) return;
    db.ref('messages').push({ name: username, text: text, time: Date.now() });
    messageInput.value = '';
};

document.getElementById('logoutBtn').onclick = () => {
    sessionStorage.removeItem('isLoggedIn');
    db.ref(`status/${username}`).remove();
    location.reload();
};

// Toggle Settings Logic
let settings = JSON.parse(localStorage.getItem('chat_settings') || '{"audio":true,"video":true,"private":true,"tone":true}');
function applySettings() {
    document.getElementById('toggleCallKnob').style.left = settings.audio ? '23px' : '3px';
    document.getElementById('toggleVideoKnob').style.left = settings.video ? '23px' : '3px';
    document.getElementById('togglePrivateKnob').style.left = settings.private ? '23px' : '3px';
    document.getElementById('toggleToneKnob').style.left = settings.tone ? '23px' : '3px';
}
applySettings();

document.getElementById('settingsBtn').onclick = () => {
    const p = document.getElementById('settingsPanel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
};
</script>
</body>
</html>
