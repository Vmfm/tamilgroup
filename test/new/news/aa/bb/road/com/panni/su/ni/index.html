<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WhatsApp Full Chat & Live</title>
<style>
:root{--bg:#111b21;--panel:#202c33;--accent:#25d366;--muted:#97a4ab;--online:#25d366;--offline:#8696a0;--live:#ff3b30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e9edef;font-family:Arial,system-ui;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* --- LOADER CSS --- */
#loader-wrapper { position: fixed; inset: 0; background: #0b141a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
.loader-wheel { width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #ffeb3b; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
.loader-text { color: #ffeb3b; font-size: 14px; font-weight: 500; letter-spacing: 1px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

#app{max-width:1100px;margin:0 auto;width:100%;height:100vh;display:flex;flex-direction:column;position:relative;transition:transform .28s ease}
#topBar{padding:8px 12px;background:#0b141a;display:flex;align-items:center;gap:12px;z-index:5}
#title{font-weight:600;display:flex;align-items:center;gap:10px}
#notifWrap{display:flex;align-items:center;gap:8px}
.bell{position:relative;cursor:pointer;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.04)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:12px;background:#ff3b30;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.6)}

#onlineCount { background: rgba(37, 211, 102, 0.1); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid rgba(37, 211, 102, 0.3); font-weight: 600; display: flex; align-items: center; gap: 6px; }

/* --- LIVE STREAM CSS --- */
#liveOverlay{position:fixed;inset:0;background:#000;z-index:9500;display:none;flex-direction:column;color:#fff}
#liveVideo{width:100%;height:100%;object-fit:cover;background:#000}
#liveHeader{position:absolute;top:0;width:100%;padding:15px;background:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);display:flex;justify-content:space-between;align-items:center;z-index:10}
.live-badge{background:var(--live);padding:4px 10px;border-radius:4px;font-size:12px;font-weight:bold;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.live-badge::before{content:'';width:8px;height:8px;background:#fff;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.live-controls{position:absolute;bottom:40px;width:100%;display:flex;justify-content:center;gap:15px;z-index:10}
.btn-live-action{padding:12px 25px;border-radius:30px;border:0;font-weight:bold;cursor:pointer;font-size:14px}
.btn-start{background:var(--accent);color:#fff}
.btn-stop{background:var(--live);color:#fff}

/* Rest of your existing CSS (Truncated for brevity, but keep yours) */
#panel{position:fixed;right:0;top:0;height:100vh;width:360px;background:#081214;border-left:1px solid rgba(255,255,255,.03);transform:translateX(100%);transition:transform .28s ease;z-index:20;display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
#messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#071215}
.msg-row{display:flex;align-items:flex-end;max-width:80%}
.msg-row.self{align-self:flex-end;flex-direction:row-reverse}
.bubble{background:var(--panel);padding:8px 12px;border-radius:12px;font-size:14px}
.msg-row.self .bubble{background:#005c4b}
#inputBar{display:flex;padding:10px;background:var(--panel);align-items:center;gap:8px}
#messageInput{flex:1;padding:10px;border-radius:22px;border:0;background:#2a3942;color:#fff;outline:none}
#loginWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:10000}
#loginCard{background:#0b141a;padding:25px;border-radius:16px;width:320px;text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;background:#2a3942;color:#fff;padding:10px 20px;border-radius:10px;z-index:11000;display:none}
</style>
</head>
<body>

<div id="loader-wrapper"><div class="loader-wheel"></div><div class="loader-text">Opening Eris Chat...</div></div>

<div id="liveOverlay">
    <div id="liveHeader">
        <div style="display:flex; align-items:center; gap:10px">
            <div class="live-badge" id="liveBadgeStatus">LIVE</div>
            <span id="liveStreamerName">Username</span>
        </div>
        <button onclick="exitLive()" style="background:none;border:0;color:#fff;font-size:24px;cursor:pointer">✕</button>
    </div>
    <video id="liveVideo" autoplay playsinline></video>
    <div class="live-controls">
        <button id="startStreamBtn" class="btn-live-action btn-start">GO LIVE</button>
        <button id="stopStreamBtn" class="btn-live-action btn-stop" style="display:none">END STREAM</button>
    </div>
</div>

<div id="app">
    <div id="topBar">
        <div id="title">Eris Chat</div>
        <div style="flex:1"></div>
        <div id="notifWrap">
            <button class="bell" id="liveToggleBtn" title="Live Streams" style="color:#ff3b30; border-color:#ff3b30">📺</button>
            <div class="bell" id="bellBtn">🔔<div class="badge" id="bellBadge" style="display:none">0</div></div>
        </div>
        <div id="onlineCount">0 online</div>
    </div>
    <div id="messages"></div>
    <div id="inputBar">
        <input id="messageInput" placeholder="Type a message..."/>
        <button id="sendBtn" style="background:var(--accent);border:0;border-radius:50%;width:40px;height:40px;color:#fff;cursor:pointer">➤</button>
    </div>
</div>

<div id="loginWrap">
    <div id="loginCard">
        <h2 style="margin-top:0">Welcome</h2>
        <input id="nameInput" placeholder="Enter Name" style="width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:0;background:#2a3942;color:#fff"/><br/>
        <button id="joinBtn" style="width:100%;padding:12px;background:var(--accent);border:0;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer">JOIN NOW</button>
    </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// State Management
let username = localStorage.getItem('guestName') || '';
let localStream = null;
let peerConnection = null;
const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

// UI Elements
const messagesEl = document.getElementById('messages');
const nameInput = document.getElementById('nameInput');
const loginWrap = document.getElementById('loginWrap');
const liveOverlay = document.getElementById('liveOverlay');
const liveVideo = document.getElementById('liveVideo');
const startStreamBtn = document.getElementById('startStreamBtn');
const stopStreamBtn = document.getElementById('stopStreamBtn');

window.addEventListener('load', () => {
    setTimeout(() => document.getElementById('loader-wrapper').style.display='none', 1000);
    if(username) {
        loginWrap.style.display = 'none';
        initApp();
    }
});

document.getElementById('joinBtn').onclick = () => {
    const n = nameInput.value.trim();
    if(n) {
        username = n;
        localStorage.setItem('guestName', n);
        loginWrap.style.display = 'none';
        initApp();
    }
};

function initApp() {
    // Standard Chat Logic
    db.ref(`status/${username}`).set(true);
    db.ref(`status/${username}`).onDisconnect().remove();
    
    // Listen for Messages
    db.ref('messages').limitToLast(50).on('child_added', snap => {
        const data = snap.val();
        renderMessage(data);
    });

    // Listen for Active Live Streams
    db.ref('liveStreams').on('value', snap => {
        const streams = snap.val();
        const liveBtn = document.getElementById('liveToggleBtn');
        if(streams) {
            liveBtn.style.animation = "pulse 1.5s infinite";
            const streamer = Object.keys(streams)[0];
            if(streamer !== username) showToast(`📺 ${streamer} is LIVE!`);
        } else {
            liveBtn.style.animation = "none";
        }
    });
}

function renderMessage(data) {
    const div = document.createElement('div');
    div.className = `msg-row ${data.name === username ? 'self' : ''}`;
    div.innerHTML = `<div class="bubble"><strong>${data.name}:</strong><br/>${data.text}</div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

document.getElementById('sendBtn').onclick = () => {
    const text = document.getElementById('messageInput').value;
    if(text) {
        db.ref('messages').push({ name: username, text: text, time: Date.now() });
        document.getElementById('messageInput').value = '';
    }
};

/* --- ERIS STYLE LIVE STREAMING LOGIC --- */

document.getElementById('liveToggleBtn').onclick = async () => {
    const snap = await db.ref('liveStreams').once('value');
    const streams = snap.val();
    
    liveOverlay.style.display = 'flex';
    
    if(streams) {
        // Someone is already live, join as viewer
        const streamerName = Object.keys(streams)[0];
        joinAsViewer(streamerName);
    } else {
        // No one is live, setup for broadcaster
        document.getElementById('liveStreamerName').textContent = "You are Broadcasting";
        startStreamBtn.style.display = 'block';
        stopStreamBtn.style.display = 'none';
        
        // Preview Camera
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        liveVideo.srcObject = localStream;
        liveVideo.muted = true;
    }
};

startStreamBtn.onclick = async () => {
    startStreamBtn.style.display = 'none';
    stopStreamBtn.style.display = 'block';
    
    // Mark as live in DB
    db.ref(`liveStreams/${username}`).set({ active: true, started: Date.now() });
    
    // Listen for viewer requests
    db.ref(`liveStreams/${username}/requests`).on('child_added', async snap => {
        const viewerId = snap.key;
        const pc = new RTCPeerConnection(rtcConfig);
        
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        
        pc.onicecandidate = e => {
            if(e.candidate) db.ref(`liveStreams/${username}/signals/${viewerId}`).push({ candidate: e.candidate.toJSON() });
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        db.ref(`liveStreams/${username}/signals/${viewerId}`).push({ offer });
        
        // Handle Answer from Viewer
        db.ref(`liveStreams/${username}/signals/${viewerId}`).on('child_added', async s => {
            const val = s.val();
            if(val.answer) pc.setRemoteDescription(new RTCSessionDescription(val.answer));
        });
    });
};

async function joinAsViewer(streamerName) {
    document.getElementById('liveStreamerName').textContent = `Watching ${streamerName}`;
    startStreamBtn.style.display = 'none';
    stopStreamBtn.style.display = 'none';
    
    peerConnection = new RTCPeerConnection(rtcConfig);
    peerConnection.ontrack = e => { liveVideo.srcObject = e.streams[0]; };
    
    // Signal the streamer that we are watching
    db.ref(`liveStreams/${streamerName}/requests/${username}`).set(true);
    
    // Listen for signaling data from streamer
    db.ref(`liveStreams/${streamerName}/signals/${username}`).on('child_added', async snap => {
        const data = snap.val();
        if(data.offer) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            db.ref(`liveStreams/${streamerName}/signals/${username}`).push({ answer });
        } else if(data.candidate) {
            peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
    });
}

function exitLive() {
    liveOverlay.style.display = 'none';
    if(localStream) {
        localStream.getTracks().forEach(t => t.stop());
        db.ref(`liveStreams/${username}`).remove();
    }
    if(peerConnection) peerConnection.close();
    liveVideo.srcObject = null;
}

stopStreamBtn.onclick = exitLive;

function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.style.display = 'block';
    setTimeout(() => t.style.display='none', 3000);
}

// Cleanup
window.onbeforeunload = () => {
    if(username) {
        db.ref(`status/${username}`).remove();
        db.ref(`liveStreams/${username}`).remove();
    }
};
</script>
</body>
</html>
