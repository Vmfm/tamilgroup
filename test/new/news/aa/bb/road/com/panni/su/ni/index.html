<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>TAMIL VM Admin - Final Ultra Control</title>
    <style>
        :root {
            --bg: #0b141a;
            --card: #111b21;
            --accent: #25d366;
            --danger: #ff3b30;
            --warning: #ff9500;
            --info: #34b7f1;
            --text: #e9edef;
            --muted: #8696a0;
            --admin-bg: #056162;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        header {
            background: var(--card);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container { padding: 10px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        h2 { font-size: 16px; margin: 0 0 15px 0; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        .search-box, .admin-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #2a3942;
            background: #111b21;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; color: var(--muted); padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-safe { background: var(--accent); color: white; }
        .btn-warn { background: var(--warning); color: white; }
        .btn-info { background: var(--info); color: white; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: var(--accent); }
        .offline { background: #555; }

        .user-cell { display: flex; align-items: center; gap: 10px; }
        .user-avatar { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            object-fit: cover; 
            background: #2a3942; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        #auth-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box { background: var(--card); padding: 30px; border-radius: 16px; text-align: center; width: 85%; max-width: 300px; }
        
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .item-row { 
            padding: 10px; 
            border-bottom: 1px solid #2a3942; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px;
        }

        .admin-msg { border-left: 4px solid var(--accent); background: rgba(37, 211, 102, 0.05); }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box">
        <img src="https://cdn-icons-png.flaticon.com/512/6024/6024190.png" style="width:60px; margin-bottom:15px;">
        <h3>Admin Secure Login</h3>
        <input type="password" id="adminPass" class="search-box" placeholder="Password">
        <button class="btn btn-safe" style="width:100%; padding: 12px;" onclick="attemptLogin()">Access Console</button>
    </div>
</div>

<header>
    <div style="font-weight: 700; display: flex; align-items: center; gap: 10px;">
        <img src="https://cdn-icons-png.flaticon.com/512/6024/6024190.png" style="width:25px;">
        TAMIL VM ADMIN
    </div>
    <button class="btn btn-warn" onclick="logout()">Logout</button>
</header>

<div class="container">
    <div class="grid">
        <div class="card" style="grid-column: span 2;">
            <h2>
                User Management 
                <small id="auto-status" style="font-size: 10px; color: var(--muted);"></small>
            </h2>
            <input type="text" id="userSearch" class="search-box" placeholder="Search users or device IDs..." onkeyup="filterUsers()">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>User Profile</th>
                            <th>Status/Device</th>
                            <th>Activity</th>
                            <th>Management</th>
                        </tr>
                    </thead>
                    <tbody id="userList"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>📢 System Broadcast</h2>
            <textarea id="notifyText" class="admin-input" rows="4" placeholder="Type announcement for all users..."></textarea>
            <button class="btn btn-safe" style="width: 100%; padding: 10px;" onclick="sendGlobalAlert()">Send Broadcast</button>
            
            <hr style="border:0; border-top:1px solid #2a3942; margin: 20px 0;">
            
            <h2>Call Signaling Logs <button class="btn btn-danger" style="font-size: 9px; padding: 4px;" onclick="clearAllCalls()">Clear All</button></h2>
            <div id="callList" style="max-height: 250px; overflow-y: auto;"></div>
        </div>
    </div>

    <div class="grid" style="margin-top: 20px;">
        <div class="card">
            <h2>Abuse Reports</h2>
            <div id="reportList"></div>
        </div>

        <div class="card">
            <h2>Live Chat Monitoring</h2>
            <div id="msgLogs" style="max-height: 450px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://vmfm.github.io/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
    const CONFIG = {
        pass: "veera123", 
        storageKey: "admin_session",
        // System Admin Profile Image
        adminAvatar: "https://cdn-icons-png.flaticon.com/512/6024/6024190.png",
        defaultAvatar: "https://cdn-icons-png.flaticon.com/512/149/149071.png"
    };

    let allUsersData = {}; 

    window.onload = () => {
        if(localStorage.getItem(CONFIG.storageKey) === "true") showPanel();
    };

    function attemptLogin() {
        if(document.getElementById('adminPass').value === CONFIG.pass) {
            localStorage.setItem(CONFIG.storageKey, "true");
            showPanel();
        } else {
            alert("Incorrect Admin Password");
        }
    }

    function logout() {
        localStorage.removeItem(CONFIG.storageKey);
        location.reload();
    }

    function showPanel() {
        document.getElementById('auth-overlay').style.display = 'none';
        initFirebase();
    }

    function initFirebase() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Listeners
        loadUsers(db);
        loadReports(db);
        loadMessages(db);
        loadCallHistory(db);
    }

    // --- BAN & PURGE LOGIC ---
    function deviceBan(username, deviceId, isCurrentlyBanned) {
        const db = firebase.database();
        const actionText = isCurrentlyBanned ? "Unban" : "PERMANENTLY BAN and CLEAR ALL DATA for";
        
        if(confirm(`${actionText} ${username}?`)) {
            // Update profile ban status
            db.ref(`profiles/${username}`).update({ banned: !isCurrentlyBanned });
            
            if(!isCurrentlyBanned) {
                // 1. Hardware ID Ban: Blocks phone from logging into ANY ID
                if(deviceId) {
                    db.ref(`banned_devices/${deviceId}`).set({
                        bannedUser: username,
                        timestamp: Date.now()
                    });
                }

                // 2. Clear Messages (Group/Public)
                db.ref('messages').once('value', snap => {
                    const msgs = snap.val() || {};
                    Object.keys(msgs).forEach(id => {
                        if(msgs[id].name === username) db.ref(`messages/${id}`).remove();
                    });
                });

                // 3. Clear Signaling (Private/Calls)
                db.ref('calls').once('value', snap => {
                    const calls = snap.val() || {};
                    Object.keys(calls).forEach(id => {
                        if(calls[id].caller === username || calls[id].receiver === username) {
                            db.ref(`calls/${id}`).remove();
                        }
                    });
                });
                
                // 4. Force Logout
                db.ref(`status/${username}`).update({ online: false });
                alert(`${username} has been fully purged and device blocked.`);
            } else {
                if(deviceId) db.ref(`banned_devices/${deviceId}`).remove();
                alert(`${username} access has been restored.`);
            }
        }
    }

    // --- ADMIN BROADCAST LOGIC ---
    function sendGlobalAlert() {
        const text = document.getElementById('notifyText').value;
        if(!text) return;
        
        firebase.database().ref('messages').push({
            name: "SYSTEM ADMIN",
            text: "🚨 OFFICIAL: " + text,
            pic: CONFIG.adminAvatar, // Using Admin Image
            timestamp: Date.now(),
            isAdmin: true,
            type: "broadcast"
        });
        
        document.getElementById('notifyText').value = '';
        alert("Broadcast sent successfully with Admin Profile Image.");
    }

    function directNotify(u) {
        const msg = prompt(`Send system warning to ${u}:`);
        if(msg) {
            firebase.database().ref('messages').push({
                name: "ADMIN",
                text: `@${u} ⚠️ ${msg}`,
                pic: CONFIG.adminAvatar,
                timestamp: Date.now(),
                isAdmin: true
            });
        }
    }

    // --- DATA DISPLAY ---
    function loadUsers(db) {
        db.ref('profiles').on('value', snap => {
            allUsersData = snap.val() || {};
            renderUserTable(allUsersData);
        });
    }

    function renderUserTable(users) {
        const list = document.getElementById('userList');
        list.innerHTML = '';
        
        Object.keys(users).forEach(u => {
            const data = users[u];
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="user-cell">
                        <img src="${data.pic || CONFIG.defaultAvatar}" class="user-avatar">
                        <div>
                            <b>${u}</b><br>
                            <small style="color:var(--muted)">ID: ${data.deviceId ? data.deviceId.substring(0,10) : 'N/A'}</small>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="status-dot ${data.online ? 'online' : 'offline'}"></span>
                    <small>${data.online ? 'Active' : 'Offline'}</small>
                </td>
                <td><small>${formatTime(data.lastSeen)}</small></td>
                <td>
                    <div class="btn-group">
                        <button class="btn ${data.banned ? 'btn-safe' : 'btn-danger'}" onclick="deviceBan('${u}', '${data.deviceId || ''}', ${data.banned || false})">
                            ${data.banned ? 'Unban' : 'Ban & Purge'}
                        </button>
                        <button class="btn btn-info" onclick="directNotify('${u}')">Warn</button>
                    </div>
                </td>
            `;
            list.appendChild(tr);
        });
    }

    function loadMessages(db) {
        db.ref('messages').limitToLast(40).on('value', snap => {
            const container = document.getElementById('msgLogs');
            container.innerHTML = '';
            const msgs = snap.val() || {};
            Object.keys(msgs).reverse().forEach(id => {
                const m = msgs[id];
                const div = document.createElement('div');
                div.className = `item-row ${m.isAdmin ? 'admin-msg' : ''}`;
                div.innerHTML = `
                    <div style="font-size:12px">
                        <img src="${m.pic || CONFIG.defaultAvatar}" style="width:18px; height:18px; border-radius:50%; vertical-align:middle; margin-right:5px;">
                        <b>${m.name}:</b> ${m.text || '[Media]'}
                    </div>
                    <button class="btn btn-danger" onclick="deleteNode('messages/${id}')" style="padding:2px 6px">X</button>
                `;
                container.appendChild(div);
            });
        });
    }

    function loadCallHistory(db) {
        db.ref('calls').limitToLast(20).on('value', snap => {
            const container = document.getElementById('callList');
            container.innerHTML = '';
            const calls = snap.val() || {};
            Object.keys(calls).reverse().forEach(id => {
                const c = calls[id];
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `
                    <span>📞 <b>${c.caller}</b> ➜ ${c.receiver}</span>
                    <button class="btn btn-danger" style="padding:2px 6px" onclick="deleteNode('calls/${id}')">X</button>
                `;
                container.appendChild(div);
            });
        });
    }

    function deleteNode(path) {
        if(confirm("Confirm deletion?")) firebase.database().ref(path).remove();
    }

    function clearAllCalls() {
        if(confirm("Permanently wipe all call signaling logs?")) firebase.database().ref('calls').remove();
    }

    function loadReports(db) {
        db.ref('reports').limitToLast(10).on('value', snap => {
            const container = document.getElementById('reportList');
            container.innerHTML = '';
            const data = snap.val() || {};
            Object.keys(data).reverse().forEach(id => {
                const r = data[id];
                const div = document.createElement('div');
                div.className = 'item-row';
                div.style.color = "var(--warning)";
                div.innerHTML = `<small>🚩 <b>${r.reported}</b> reported by ${r.by}</small>`;
                container.appendChild(div);
            });
        });
    }

    function filterUsers() {
        const q = document.getElementById('userSearch').value.toLowerCase();
        const filtered = {};
        Object.keys(allUsersData).forEach(u => {
            if(u.toLowerCase().includes(q) || (allUsersData[u].deviceId && allUsersData[u].deviceId.toLowerCase().includes(q))) {
                filtered[u] = allUsersData[u];
            }
        });
        renderUserTable(filtered);
    }

    function formatTime(ts) {
        if(!ts) return "---";
        const d = new Date(ts);
        return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
</script>
</body>
</html>
