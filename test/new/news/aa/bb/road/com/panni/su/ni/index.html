<!DOCTYPE html>

    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #072859;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --accent: #ffcc00;
        }

        .light-mode {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --card-bg: #ffffff;
            --accent: #004e92;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 50px;
            transition: 0.3s ease;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand { font-weight: 600; font-size: 1.1rem; color: var(--accent); }

        .nav-btn {
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-fav { background: #ff6600; color: white; margin-right: 5px; }
        .btn-mode { background: var(--accent); color: #000; }

        /* Grid Layout - 3 per row */
        .station-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 15px;
            max-width: 900px;
            margin: auto;
        }

        .station-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .station-card:active { transform: scale(0.95); }

        .station-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
        }

        .station-info {
            padding: 8px 4px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fav-star {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        a { text-decoration: none; color: inherit; }
    </style>
</head>

<script>
    // Favorites System
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

    document.addEventListener("click", function(e) {
        if (e.target.classList.contains("fav-star")) {
            const btn = e.target;
            const station = {
                name: btn.dataset.name,
                img: btn.dataset.img,
                link: btn.dataset.link
            };

            const index = favorites.findIndex(f => f.name === station.name);
            if (index > -1) {
                favorites.splice(index, 1);
                btn.textContent = "☆";
                btn.style.color = "white";
            } else {
                favorites.push(station);
                btn.textContent = "⭐";
                btn.style.color = "#ffcc00";
            }
            localStorage.setItem("favorites", JSON.stringify(favorites));
        }
    });

    function loadFavorites() {
        document.querySelectorAll(".fav-star").forEach(btn => {
            if (favorites.find(f => f.name === btn.dataset.name)) {
                btn.textContent = "⭐";
                btn.style.color = "#ffcc00";
            }
        });
    }

    function toggleMode() {
        document.body.classList.toggle("light-mode");
    }

    window.onload = loadFavorites;
</script>
