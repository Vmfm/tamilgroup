<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>TAMIL VM Admin - Ultra Control</title>
    <style>
        :root {
            --bg: #0b141a;
            --card: #111b21;
            --accent: #25d366;
            --danger: #ff3b30;
            --warning: #ff9500;
            --info: #34b7f1;
            --text: #e9edef;
            --muted: #8696a0;
            --admin-msg: #056162;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        header {
            background: var(--card);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container { padding: 10px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        h2 { font-size: 16px; margin: 0 0 15px 0; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        .search-box, .admin-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #2a3942;
            background: #111b21;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; color: var(--muted); padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-safe { background: var(--accent); color: white; }
        .btn-warn { background: var(--warning); color: white; }
        .btn-info { background: var(--info); color: white; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: var(--accent); }
        .offline { background: #555; }
        .banned { background: var(--danger); }

        .user-cell { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #2a3942; }

        #auth-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box { background: var(--card); padding: 30px; border-radius: 16px; text-align: center; width: 85%; max-width: 300px; }
        
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .msg-item { padding: 10px; border-bottom: 1px solid #2a3942; display: flex; justify-content: space-between; font-size: 12px; }
        .admin-badge { background: var(--accent); color: black; padding: 2px 5px; border-radius: 4px; font-size: 9px; margin-right: 5px; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box">
        <h3>Admin Secure Login</h3>
        <input type="password" id="adminPass" class="search-box" placeholder="Password">
        <button class="btn btn-safe" style="width:100%; padding: 12px;" onclick="attemptLogin()">Access Console</button>
    </div>
</div>

<header>
    <div style="font-weight: 700;">🛡️ TAMIL VM ADMIN <span id="server-time" style="font-weight: normal; font-size: 10px; color: var(--muted); margin-left: 10px;"></span></div>
    <button class="btn btn-warn" onclick="logout()">Logout</button>
</header>

<div class="container">
    <div class="grid">
        <div class="card" style="grid-column: span 2;">
            <h2>User Management <small id="auto-status" style="font-size: 10px; color: var(--muted);"></small></h2>
            <input type="text" id="userSearch" class="search-box" placeholder="Search by username or Device ID..." onkeyup="filterUsers()">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>User Profile</th>
                            <th>Status/Device</th>
                            <th>Last Seen</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userList"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>📢 Send Global Alert</h2>
            <p style="font-size: 11px; color: var(--muted);">This will show for ALL users as an Admin Message.</p>
            <textarea id="globalMsg" class="admin-input" rows="3" placeholder="Type notification message..."></textarea>
            <button class="btn btn-safe" style="width: 100%" onclick="sendGlobalNotification()">Broadcast Message</button>
            <hr style="border: 0; border-top: 1px solid #2a3942; margin: 15px 0;">
            <h3>Banned Devices Log</h3>
            <div id="bannedList" style="max-height: 150px; overflow-y: auto; font-size: 11px; color: var(--danger);"></div>
        </div>
    </div>

    <div class="grid" style="margin-top: 20px;">
        <div class="card">
            <h2>Recent Chat Logs</h2>
            <div id="msgLogs" style="max-height: 400px; overflow-y: auto;"></div>
        </div>

        <div class="card">
            <h2>Call History <button class="btn btn-danger" style="font-size: 9px; padding: 4px;" onclick="clearAllCalls()">Clear All</button></h2>
            <div id="callList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://vmfm.github.io/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
    const ADMIN_CONFIG = {
        pass: "veera123",
        storageKey: "admin_active_session",
        defaultAvatar: "https://cdn-icons-png.flaticon.com/512/149/149071.png"
    };

    let allUsersData = {};

    // 1. AUTH LOGIC
    function attemptLogin() {
        if(document.getElementById('adminPass').value === ADMIN_CONFIG.pass) {
            localStorage.setItem(ADMIN_CONFIG.storageKey, "true");
            location.reload();
        } else { alert("Access Denied"); }
    }

    function logout() {
        localStorage.removeItem(ADMIN_CONFIG.storageKey);
        location.reload();
    }

    window.onload = () => {
        if(localStorage.getItem(ADMIN_CONFIG.storageKey) === "true") {
            document.getElementById('auth-overlay').style.display = 'none';
            initApp();
        }
    };

    // 2. CORE INITIALIZATION
    function initApp() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        loadUsers(db);
        loadMessages(db);
        loadCallHistory(db);
        loadBannedDevices(db);
        
        // Clock
        setInterval(() => {
            document.getElementById('server-time').innerText = new Date().toLocaleTimeString();
        }, 1000);
    }

    // 3. HARDWARE BAN LOGIC
    // This function bans the username AND the deviceId. 
    // The user app should check 'banned_devices' node upon startup.
    function toggleDeviceBan(username, deviceId, currentStatus) {
        const db = firebase.database();
        const isBanning = !currentStatus;
        const msg = isBanning ? `Ban ${username} and block their phone hardware?` : `Unban ${username}?`;

        if(confirm(msg)) {
            // Mark profile
            db.ref(`profiles/${username}`).update({ banned: isBanning });
            
            if(isBanning && deviceId) {
                // Add to Hardware Block List
                db.ref(`banned_devices/${deviceId}`).set({
                    bannedUser: username,
                    timestamp: Date.now()
                });
                // Force logout by killing status
                db.ref(`status/${username}`).update({ online: false });
                // Clean their spam
                cleanSpam(username);
            } else if (!isBanning && deviceId) {
                // Remove Hardware Block
                db.ref(`banned_devices/${deviceId}`).remove();
            }
        }
    }

    function loadBannedDevices(db) {
        db.ref('banned_devices').on('value', snap => {
            const container = document.getElementById('bannedList');
            container.innerHTML = '';
            const data = snap.val() || {};
            Object.keys(data).forEach(id => {
                const div = document.createElement('div');
                div.innerHTML = `🚫 Device: <b>${id}</b> (${data[id].bannedUser})`;
                container.appendChild(div);
            });
        });
    }

    // 4. NOTIFICATION / ADMIN CHAT LOGIC
    function sendGlobalNotification() {
        const text = document.getElementById('globalMsg').value;
        if(!text) return;

        const db = firebase.database();
        const msgId = "admin_" + Date.now();
        
        db.ref(`messages/${msgId}`).set({
            name: "SYSTEM ADMIN",
            text: "📢 " + text,
            timestamp: Date.now(),
            isAdmin: true,
            type: "notification"
        }).then(() => {
            alert("Broadcast sent to all users!");
            document.getElementById('globalMsg').value = '';
        });
    }

    // 5. DATA RENDERING
    function loadUsers(db) {
        db.ref('profiles').on('value', snap => {
            allUsersData = snap.val() || {};
            renderUserTable(allUsersData);
        });
    }

    function renderUserTable(users) {
        const list = document.getElementById('userList');
        list.innerHTML = '';
        
        Object.keys(users).forEach(u => {
            const data = users[u];
            const deviceId = data.deviceId || 'UnknownID';
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>
                    <div class="user-cell">
                        <img src="${data.pic || ADMIN_CONFIG.defaultAvatar}" class="user-avatar">
                        <div>
                            <b>${u}</b><br>
                            <small style="color:var(--muted)">ID: ${deviceId.substring(0,8)}...</small>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="status-dot ${data.banned ? 'banned' : (data.online ? 'online' : 'offline')}"></span>
                    <span style="font-size:11px">${data.banned ? 'BANNED' : (data.online ? 'Online' : 'Offline')}</span>
                </td>
                <td><small>${formatDate(data.lastSeen)}</small></td>
                <td>
                    <div class="btn-group">
                        <button class="btn ${data.banned ? 'btn-safe' : 'btn-danger'}" 
                                onclick="toggleDeviceBan('${u}', '${data.deviceId || ''}', ${data.banned || false})">
                            ${data.banned ? 'Unban' : 'Device Ban'}
                        </button>
                        <button class="btn btn-info" onclick="directNotify('${u}')">Notify</button>
                    </div>
                </td>
            `;
            list.appendChild(tr);
        });
    }

    function directNotify(username) {
        const msg = prompt(`Send private admin alert to ${username}:`);
        if(msg) {
            firebase.database().ref('messages').push({
                name: "ADMIN",
                text: `@${username} ${msg}`,
                timestamp: Date.now(),
                isAdmin: true
            });
        }
    }

    function loadMessages(db) {
        db.ref('messages').limitToLast(40).on('value', snap => {
            const container = document.getElementById('msgLogs');
            container.innerHTML = '';
            const msgs = snap.val() || {};
            Object.keys(msgs).reverse().forEach(id => {
                const m = msgs[id];
                const div = document.createElement('div');
                div.className = 'msg-item';
                div.innerHTML = `
                    <div>
                        ${m.isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}
                        <b>${m.name}:</b> ${m.text}
                    </div>
                    <button class="btn btn-danger" style="padding:2px 5px" onclick="deleteNode('messages/${id}')">X</button>
                `;
                container.appendChild(div);
            });
        });
    }

    function loadCallHistory(db) {
        db.ref('calls').limitToLast(20).on('value', snap => {
            const container = document.getElementById('callList');
            container.innerHTML = '';
            const calls = snap.val() || {};
            Object.keys(calls).reverse().forEach(id => {
                const c = calls[id];
                const div = document.createElement('div');
                div.className = 'msg-item';
                div.innerHTML = `
                    <div>📞 <b>${c.caller}</b> ➔ ${c.receiver}</div>
                    <button class="btn btn-danger" style="padding:2px 5px" onclick="deleteNode('calls/${id}')">Del</button>
                `;
                container.appendChild(div);
            });
        });
    }

    // UTILITIES
    function deleteNode(path) {
        if(confirm("Delete this entry?")) firebase.database().ref(path).remove();
    }

    function cleanSpam(username) {
        const db = firebase.database();
        db.ref('messages').once('value', snap => {
            const msgs = snap.val() || {};
            Object.keys(msgs).forEach(id => {
                if(msgs[id].name === username) db.ref(`messages/${id}`).remove();
            });
        });
    }

    function formatDate(ts) {
        if(!ts) return "---";
        return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function filterUsers() {
        const q = document.getElementById('userSearch').value.toLowerCase();
        const filtered = {};
        Object.keys(allUsersData).forEach(u => {
            if(u.toLowerCase().includes(q) || (allUsersData[u].deviceId && allUsersData[u].deviceId.includes(q))) {
                filtered[u] = allUsersData[u];
            }
        });
        renderUserTable(filtered);
    }
</script>
</body>
</html>
