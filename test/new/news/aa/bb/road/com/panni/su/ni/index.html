<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <title>TAMIL VM Admin - Ultra Power</title>
    <style>
        :root {
            --bg: #0b141a;
            --card: #111b21;
            --accent: #25d366;
            --danger: #ff3b30;
            --warning: #ff9500;
            --info: #34b7f1;
            --text: #e9edef;
            --muted: #8696a0;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        header {
            background: var(--card);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container { padding: 10px; max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
        h2 { font-size: 16px; margin: 0 0 15px 0; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        .search-box, .admin-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #2a3942;
            background: #111b21;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; color: var(--muted); padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; }
        
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-safe { background: var(--accent); color: white; }
        .btn-warn { background: var(--warning); color: white; }
        .btn-info { background: var(--info); color: white; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: var(--accent); }
        .offline { background: #555; }

        .user-cell { display: flex; align-items: center; gap: 10px; }
        .user-avatar { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            object-fit: cover; 
            background: #2a3942; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        #auth-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box { background: var(--card); padding: 30px; border-radius: 16px; text-align: center; width: 85%; max-width: 300px; }
        
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .item-row { 
            padding: 10px; 
            border-bottom: 1px solid #2a3942; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px;
        }

        .admin-msg-row { background: rgba(37, 211, 102, 0.1); border-left: 3px solid var(--accent); }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="login-box">
        <img src="https://cdn-icons-png.flaticon.com/512/6024/6024190.png" style="width:60px; margin-bottom:15px;">
        <h3>Admin Login</h3>
        <input type="password" id="adminPass" class="search-box" placeholder="Password">
        <button class="btn btn-safe" style="width:100%; padding: 12px;" onclick="attemptLogin()">Enter Console</button>
    </div>
</div>

<header>
    <div style="font-weight: 700; display: flex; align-items: center; gap: 10px;">
        <img src="https://cdn-icons-png.flaticon.com/512/6024/6024190.png" style="width:25px;">
        TAMIL VM ADMIN 
        <span id="userCount" style="font-size: 10px; background: #2a3942; padding: 2px 8px; border-radius: 10px; color: var(--accent);">0 Users</span>
    </div>
    <button class="btn btn-warn" onclick="logout()">Logout</button>
</header>

<div class="container">
    <div class="grid">
        <div class="card" style="grid-column: span 2;">
            <h2>User Control Panel</h2>
            <input type="text" id="userSearch" class="search-box" placeholder="Search by name or Hardware ID..." onkeyup="filterUsers()">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Profile</th>
                            <th>Hardware ID</th>
                            <th>Last Seen</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userList"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>📢 Group Broadcast</h2>
            <p style="font-size: 11px; color: var(--muted); margin-top: -10px;">Will show in Group with Admin Image</p>
            <textarea id="notifyText" class="admin-input" rows="4" placeholder="Message for all users..."></textarea>
            <button class="btn btn-safe" style="width: 100%;" onclick="sendGlobalAlert()">Broadcast to Group</button>
            <hr style="border:0; border-top:1px solid #2a3942; margin: 20px 0;">
            <h3>Call Logs</h3>
            <div id="callList" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>

    <div class="grid" style="margin-top: 20px;">
        <div class="card">
            <h2>Reports Log</h2>
            <div id="reportList"></div>
        </div>
        <div class="card">
            <h2>Live Group Messages</h2>
            <div id="msgLogs" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://vmfm.github.io/tamilgroup/test/new/news/aa/bb/road/com/config.js"></script>

<script>
    const CONFIG = {
        pass: "veera123", 
        storageKey: "admin_active",
        // The Admin Profile Image used in the Group Chat
        adminPic: "https://cdn-icons-png.flaticon.com/512/6024/6024190.png",
        defaultUserPic: "https://cdn-icons-png.flaticon.com/512/149/149071.png"
    };

    let allUsersData = {}; 

    // Auth Logic
    function attemptLogin() {
        if(document.getElementById('adminPass').value === CONFIG.pass) {
            localStorage.setItem(CONFIG.storageKey, "true");
            location.reload();
        } else { alert("Access Denied"); }
    }
    function logout() {
        localStorage.removeItem(CONFIG.storageKey);
        location.reload();
    }

    window.onload = () => {
        if(localStorage.getItem(CONFIG.storageKey) === "true") {
            document.getElementById('auth-overlay').style.display = 'none';
            initAdmin();
        }
    };

    function initAdmin() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        loadUsers(db);
        loadMessages(db);
        loadCallHistory(db);
        loadReports(db);
    }

    // --- FULL BAN & PURGE LOGIC ---
    function performAction(username, deviceId, isBanned) {
        const db = firebase.database();
        const action = isBanned ? "Unban" : "PERMANENT BAN & DATA WIPE";
        
        if(confirm(`${action} for ${username}?`)) {
            // 1. Mark Profile Status
            db.ref(`profiles/${username}`).update({ banned: !isBanned });

            if(!isBanned) {
                // 2. Hardware/Phone Ban
                if(deviceId) {
                    db.ref(`banned_devices/${deviceId}`).set({
                        user: username,
                        bannedAt: Date.now()
                    });
                }
                // 3. Purge Group Messages
                db.ref('messages').once('value', snap => {
                    snap.forEach(child => {
                        if(child.val().name === username) child.ref.remove();
                    });
                });
                // 4. Purge Signaling/Calls
                db.ref('calls').once('value', snap => {
                    snap.forEach(child => {
                        const c = child.val();
                        if(c.caller === username || c.receiver === username) child.ref.remove();
                    });
                });
                // 5. Force Offline
                db.ref(`status/${username}`).update({ online: false });
                alert("User wiped and phone blocked.");
            } else {
                if(deviceId) db.ref(`banned_devices/${deviceId}`).remove();
                alert("Access Restored.");
            }
        }
    }

    // --- ADMIN BROADCAST WITH IMAGE ---
    function sendGlobalAlert() {
        const msg = document.getElementById('notifyText').value;
        if(!msg) return;

        firebase.database().ref('messages').push({
            name: "SYSTEM ADMIN",
            text: "🚨 " + msg,
            pic: CONFIG.adminPic, // SHOWS ADMIN IMAGE IN GROUP
            timestamp: Date.now(),
            isAdmin: true
        });

        document.getElementById('notifyText').value = '';
        alert("Broadcast posted to group!");
    }

    // --- RENDER FUNCTIONS ---
    function loadUsers(db) {
        db.ref('profiles').on('value', snap => {
            allUsersData = snap.val() || {};
            document.getElementById('userCount').innerText = Object.keys(allUsersData).length + " Users";
            renderUserTable(allUsersData);
        });
    }

    function renderUserTable(users) {
        const list = document.getElementById('userList');
        list.innerHTML = '';
        Object.keys(users).forEach(u => {
            const d = users[u];
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="user-cell">
                        <img src="${d.pic || CONFIG.defaultUserPic}" class="user-avatar">
                        <b>${u}</b>
                    </div>
                </td>
                <td><small style="color:var(--muted)">${d.deviceId || 'No ID'}</small></td>
                <td><span class="status-dot ${d.online ? 'online' : 'offline'}"></span> <small>${formatTime(d.lastSeen)}</small></td>
                <td>
                    <div class="btn-group">
                        <button class="btn ${d.banned ? 'btn-safe' : 'btn-danger'}" onclick="performAction('${u}', '${d.deviceId || ''}', ${d.banned || false})">
                            ${d.banned ? 'Unban' : 'Ban & Wipe'}
                        </button>
                        <button class="btn btn-info" onclick="manualNotify('${u}')">Notify</button>
                    </div>
                </td>
            `;
            list.appendChild(tr);
        });
    }

    function loadMessages(db) {
        db.ref('messages').limitToLast(30).on('value', snap => {
            const container = document.getElementById('msgLogs');
            container.innerHTML = '';
            const data = snap.val() || {};
            Object.keys(data).reverse().forEach(id => {
                const m = data[id];
                const div = document.createElement('div');
                div.className = `item-row ${m.isAdmin ? 'admin-msg-row' : ''}`;
                div.innerHTML = `
                    <div>
                        <img src="${m.pic || CONFIG.defaultUserPic}" style="width:20px; height:20px; border-radius:50%; vertical-align:middle; margin-right:5px;">
                        <b>${m.name}:</b> ${m.text || '[Media]'}
                    </div>
                    <button class="btn btn-danger" style="padding:2px 5px" onclick="deleteItem('messages/${id}')">X</button>
                `;
                container.appendChild(div);
            });
        });
    }

    function manualNotify(u) {
        const txt = prompt(`Send system alert to ${u}:`);
        if(txt) {
            firebase.database().ref('messages').push({
                name: "ADMIN",
                text: `@${u} ${txt}`,
                pic: CONFIG.adminPic,
                timestamp: Date.now(),
                isAdmin: true
            });
        }
    }

    function loadCallHistory(db) {
        db.ref('calls').limitToLast(10).on('value', snap => {
            const container = document.getElementById('callList');
            container.innerHTML = '';
            const data = snap.val() || {};
            Object.keys(data).reverse().forEach(id => {
                const c = data[id];
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `<span>📞 ${c.caller} ➜ ${c.receiver}</span> <button class="btn btn-danger" style="padding:2px 5px" onclick="deleteItem('calls/${id}')">X</button>`;
                container.appendChild(div);
            });
        });
    }

    function loadReports(db) {
        db.ref('reports').on('value', snap => {
            const container = document.getElementById('reportList');
            container.innerHTML = '';
            const data = snap.val() || {};
            Object.keys(data).reverse().forEach(id => {
                const r = data[id];
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `<span style="color:var(--warning)">🚩 <b>${r.reported}</b> (by ${r.by})</span> <button class="btn btn-danger" style="padding:2px 5px" onclick="deleteItem('reports/${id}')">X</button>`;
                container.appendChild(div);
            });
        });
    }

    function deleteItem(path) {
        if(confirm("Delete this?")) firebase.database().ref(path).remove();
    }

    function filterUsers() {
        const q = document.getElementById('userSearch').value.toLowerCase();
        const filtered = {};
        Object.keys(allUsersData).forEach(u => {
            if(u.toLowerCase().includes(q) || (allUsersData[u].deviceId && allUsersData[u].deviceId.includes(q))) {
                filtered[u] = allUsersData[u];
            }
        });
        renderUserTable(filtered);
    }

    function formatTime(ts) {
        if(!ts) return "Never";
        return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
</script>
</body>
</html>
