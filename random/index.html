<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Realtime DB Client</title>
    <!-- Import Socket.io client library -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 30px; background: #f4f6f9; color: #333; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { padding: 10px; font-size: 16px; margin: 5px 0; }
        input { width: 70%; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .status { font-weight: bold; color: green; }
    </style>
</head>
<body>

<div class="container">
    <h2>My Custom Realtime DB</h2>
    <p>Status: <span id="status" class="status">Connecting...</span></p>

    <!-- Data Entry form -->
    <input type="text" id="msgInput" placeholder="Type something to update database...">
    <button onclick="saveToCustomDB()">Set Data</button>

    <h3>Live Node JSON Snapshot:</h3>
    <pre id="jsonDisplay">Loading database tree...</pre>
</div>

<script>
    // Connect to your custom self-hosted server
    const socket = io('http://localhost:3000');
    
    // Track connection state
    socket.on('connect', () => {
        document.getElementById('status').innerText = "Connected";
        document.getElementById('status').style.color = "green";
    });
    
    socket.on('disconnect', () => {
        document.getElementById('status').innerText = "Disconnected";
        document.getElementById('status').style.color = "red";
    });

    // Global variable to keep local state match
    let localDBCopy = {};

    // Listen for the initial database dump
    socket.on('db-snapshot', (entireDb) => {
        localDBCopy = entireDb;
        renderData();
    });

    // Listen for incremental real-time changes made by anyone
    socket.on('db-value-changed', (updatedNode) => {
        console.log("Realtime event received:", updatedNode);
        
        // Update local object map
        localDBCopy[updatedNode.node] = updatedNode.data;
        renderData();
    });

    // Custom helper to write data (Simulating Firebase set)
    function saveToCustomDB() {
        const textValue = document.getElementById('msgInput').value;
        if(!textValue.trim()) return;

        // Push layout payload targeting a specific key/node
        socket.emit('db-write', {
            node: "globalChat",
            data: {
                text: textValue,
                sender: "Client_" + socket.id.substring(0,4)
            }
        });
        
        document.getElementById('msgInput').value = "";
    }

    // Update User Interface
    function renderData() {
        document.getElementById('jsonDisplay').textContent = JSON.stringify(localDBCopy, null, 2);
    }
</script>
</body>
</html>
